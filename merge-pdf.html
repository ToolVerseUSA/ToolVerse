<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF | Premium ToolVerse</title>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body { background-color: #f8fafc; }
        .merge-workspace { max-width: 1000px; margin: 40px auto; padding: 0 20px; text-align: center; }
        
        /* Premium Upload Zone */
        .upload-zone {
            background: #ffffff;
            border: 3px dashed #cbd5e1;
            border-radius: 20px;
            padding: 80px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #e5322d;
            background: #fef2f2;
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(229, 50, 45, 0.1);
        }
        .upload-icon { font-size: 60px; color: #e5322d; margin-bottom: 20px; transition: 0.3s; }
        .upload-zone:hover .upload-icon { transform: scale(1.1); }
        .upload-zone h2 { font-size: 24px; color: #1e293b; margin-bottom: 10px; font-weight: 800; }
        .upload-zone p { color: #64748b; font-size: 16px; }
        
        /* Action Panel & File Grid (Hidden by default) */
        .workspace-panel { display: none; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .file-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 30px 0;
            padding: 20px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            min-height: 250px;
        }

        /* Draggable PDF Card */
        .pdf-item {
            width: 140px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 10px;
            position: relative;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.2s;
        }
        .pdf-item:active { cursor: grabbing; transform: scale(1.05); border-color: #e5322d; box-shadow: 0 10px 20px rgba(229,50,45,0.15);}
        .pdf-item:hover { border-color: #cbd5e1; }
        .pdf-item .drag-handle { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        .pdf-item .pdf-icon { font-size: 40px; color: #e5322d; margin-bottom: 10px; }
        .pdf-item .file-name {
            font-size: 12px; font-weight: 600; color: #334155; text-align: center;
            width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .pdf-item .remove-btn {
            position: absolute; top: -8px; right: -8px; background: #ff4757; color: white;
            width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 12px; cursor: pointer; border: 2px solid #fff;
            transition: 0.2s;
        }
        .pdf-item .remove-btn:hover { transform: scale(1.2); background: #e0313f; }

        /* Controls */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn-add-more {
            background: #ffffff; color: #1e293b; border: 2px solid #e2e8f0;
            padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 16px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-add-more:hover { border-color: #cbd5e1; background: #f1f5f9; }
        
        .btn-merge-action {
            background: #e5322d; color: #ffffff; border: none;
            padding: 16px 40px; border-radius: 12px; font-weight: 800; font-size: 18px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 25px rgba(229, 50, 45, 0.3);
            flex-grow: 1; justify-content: center;
        }
        .btn-merge-action:hover { background: #c62828; transform: translateY(-2px); box-shadow: 0 15px 35px rgba(229, 50, 45, 0.4); }
        .btn-merge-action:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
</head>
<body>

    <header class="ilove-header">
        <div class="header-container">
            <a href="index.html" class="logo-area" style="text-decoration:none;">
                <span class="logo-icon">🚀</span> <span class="logo-text">ToolVerse</span>
            </a>
            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="index.html#pdf-tools" style="color: #e5322d; font-weight: 700;"><i class="fa-solid fa-arrow-left"></i> Back to Tools</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="tool-header" style="background: linear-gradient(to right, #fef2f2, #fff1f2); padding: 50px 20px 30px; border-bottom: 1px solid #fee2e2;">
        <div class="tool-icon bg-red" style="margin: 0 auto 15px;"><i class="fa-solid fa-code-merge"></i></div>
        <h1 style="font-size: 2.8rem; color: #1e293b; margin-bottom: 10px; font-weight: 800;">Merge PDF</h1>
        <p style="color: #64748b; font-size: 1.1rem;">Combine PDFs in the order you want. 100% secure, processed locally in your browser.</p>
    </section>

    <div class="merge-workspace">
        
        <!-- INITIAL UPLOAD ZONE -->
        <div class="upload-zone" id="dropZone">
            <i class="fa-solid fa-file-pdf upload-icon"></i>
            <h2>Select PDF files</h2>
            <p>or drop PDFs here</p>
            <input type="file" id="fileInput" accept="application/pdf" multiple hidden>
        </div>

        <!-- WORKSPACE PANEL (Shows after files are selected) -->
        <div class="workspace-panel" id="workspacePanel">
            
            <p style="text-align: left; color: #64748b; font-weight: 600; margin-bottom: -15px;">
                <i class="fa-solid fa-arrows-up-down-left-right"></i> Drag and drop to reorder your PDFs
            </p>
            
            <!-- Grid where Sortable Cards will appear -->
            <div class="file-grid" id="fileGrid"></div>
            
            <div class="controls-bar">
                <button class="btn-add-more" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-plus"></i> Add more files
                </button>
                <button class="btn-merge-action" id="mergeBtn">
                    Merge PDFs <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
            <div id="statusMessage" style="margin-top: 20px; font-weight: 600; font-size: 15px; color: #10b981; display: none;">
                <i class="fa-solid fa-circle-check"></i> PDFs Merged Successfully! Downloading now...
            </div>
        </div>

    </div>

    <!-- Required Libraries for VVIP Functionality -->
    <!-- SortableJS for Drag & Drop Reordering -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- PDF-Lib for Client-Side PDF Merging (Super Fast & Secure) -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- App Logic -->
    <script src="merge-pdf.js"></script>

</body>
</html>
