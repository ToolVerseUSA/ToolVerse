<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk SEO Auto-Blogger - ToolVerse Pro</title>
    
    <meta name="description" content="Generate up to 50 SEO-optimized blog articles in one click. Download all as a ZIP file. 100% Free on ToolVerse." />
    
    <!-- VVIP LIBRARIES FOR ZIP DOWNLOAD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { -webkit-tap-highlight-color: transparent !important; outline: none !important; box-sizing: border-box; }

        :root {
            --bg-dark: #050b14;
            --panel-bg: rgba(15, 23, 42, 0.7);
            --border-color: rgba(77, 166, 255, 0.15);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .studio-nav {
            height: 65px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: rgba(5, 11, 20, 0.9);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; }
        .brand-badge { background: linear-gradient(135deg, #f59e0b, #ef4444); padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;}
        .btn-back { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s; text-decoration: none; font-size: 0.9rem;}
        .btn-back:hover { color: white; border-color: white; }

        /* Main Grid */
        .main-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            flex: 1;
            height: calc(100vh - 65px);
        }

        /* Left Settings Panel */
        .settings-panel {
            background: rgba(15, 23, 42, 0.5);
            border-right: 1px solid var(--border-color);
            padding: 30px 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .panel-title { margin: 0 0 5px 0; font-size: 1.3rem; font-weight: 700; color: white; }
        .panel-desc { margin: 0; font-size: 0.85rem; color: var(--text-muted); }

        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #cbd5e1; }
        .form-control { width: 100%; padding: 12px 15px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: white; font-family: inherit; font-size: 0.95rem; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
        
        .slider-container { display: flex; align-items: center; gap: 15px; }
        .slider-val { background: var(--primary); color: white; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 0.9rem; min-width: 45px; text-align: center; }
        input[type=range] { flex: 1; accent-color: var(--primary); }

        .btn-generate { background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3); width: 100%; margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-generate:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(139, 92, 246, 0.5); }
        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        /* Right Results Panel */
        .results-panel {
            padding: 30px 40px;
            overflow-y: auto;
            position: relative;
        }

        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .results-header h2 { margin: 0; font-size: 1.8rem; }
        
        .btn-download-all { background: var(--success); color: #050b14; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; display: none; align-items: center; gap: 8px; transition: 0.3s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        .btn-download-all:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }

        .empty-state { height: 60%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #475569; text-align: center; }
        .empty-state i { font-size: 4rem; margin-bottom: 15px; opacity: 0.5; }
        .empty-state h3 { margin: 0 0 10px 0; color: #94a3b8; }

        /* Article Cards */
        .articles-grid { display: grid; grid-template-columns: 1fr; gap: 20px; padding-bottom: 50px; }
        .article-card { background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 12px; padding: 20px; transition: 0.3s; }
        .article-card:hover { border-color: rgba(139, 92, 246, 0.4); }
        .article-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        .article-top h3 { margin: 0; font-size: 1.1rem; color: var(--primary); }
        .status-badge { background: rgba(16, 185, 129, 0.1); color: var(--success); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .article-preview { font-size: 0.9rem; color: #cbd5e1; line-height: 1.6; max-height: 100px; overflow: hidden; position: relative; }
        .article-preview::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 40px; background: linear-gradient(transparent, rgba(15, 23, 42, 1)); }

        /* Progress Overlay */
        .progress-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 11, 20, 0.9); backdrop-filter: blur(15px); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .progress-overlay.active { display: flex; }
        
        .loader-ring { width: 80px; height: 80px; border: 6px solid rgba(139, 92, 246, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 25px; box-shadow: 0 0 30px rgba(139, 92, 246, 0.3); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .progress-text { font-size: 1.8rem; font-weight: 800; color: white; margin-bottom: 10px; }
        .progress-subtext { color: var(--primary); font-size: 1rem; font-weight: 600; }
        
        .progress-bar-container { width: 400px; height: 10px; background: #1e293b; border-radius: 10px; margin-top: 30px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #3b82f6); width: 0%; transition: width 0.4s ease; }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; height: auto; overflow: visible; }
            .settings-panel { border-right: none; border-bottom: 1px solid var(--border-color); }
        }
    </style>
</head>
<body>

    <header class="studio-nav">
        <div class="brand">
            🚀 ToolVerse <span class="brand-badge">Bulk Auto-Blogger</span>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="btn-back">← Dashboard</a>
        </div>
    </header>

    <div class="main-container">
        <!-- Settings Panel -->
        <div class="settings-panel">
            <div>
                <h2 class="panel-title">Campaign Settings</h2>
                <p class="panel-desc">Configure your bulk article generation.</p>
            </div>

            <div class="form-group">
                <label>Niche / Main Topic</label>
                <input type="text" id="nicheInput" class="form-control" placeholder="e.g., Cryptocurrency Trading, Weight Loss..." required>
            </div>

            <div class="form-group">
                <label>Number of Articles to Generate</label>
                <div class="slider-container">
                    <input type="range" id="countSlider" min="1" max="50" value="5" oninput="document.getElementById('countVal').innerText = this.value">
                    <div class="slider-val" id="countVal">5</div>
                </div>
            </div>

            <div class="form-group">
                <label>Tone of Voice</label>
                <select id="toneSelect" class="form-control">
                    <option value="Professional & Informative">Professional & Informative</option>
                    <option value="Casual & Engaging">Casual & Engaging</option>
                    <option value="Persuasive & Sales-driven">Persuasive & Sales-driven</option>
                    <option value="Humorous">Humorous</option>
                </select>
            </div>

            <div class="form-group">
                <label>Target Language</label>
                <select id="langSelect" class="form-control">
                    <option value="English (US)">English (US)</option>
                    <option value="English (UK)">English (UK)</option>
                    <option value="Urdu">Urdu</option>
                    <option value="Spanish">Spanish</option>
                    <option value="French">French</option>
                </select>
            </div>

            <button class="btn-generate" id="startBtn" onclick="startBulkGeneration()">
                <i class="fa-solid fa-bolt"></i> Generate Bulk Articles
            </button>
        </div>

        <!-- Results Panel -->
        <div class="results-panel">
            <div class="results-header">
                <h2>Generated Content</h2>
                <button class="btn-download-all" id="downloadZipBtn" onclick="downloadAllAsZip()">
                    <i class="fa-solid fa-file-zipper"></i> Download All (ZIP)
                </button>
            </div>

            <div id="resultsGrid" class="articles-grid">
                <div class="empty-state">
                    <i class="fa-solid fa-layer-group"></i>
                    <h3>No Articles Yet</h3>
                    <p>Enter your topic on the left and click generate to start the magic.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Progress Overlay -->
    <div id="progressOverlay" class="progress-overlay">
        <div class="loader-ring"></div>
        <div class="progress-text" id="progText">Generating 1 of 5</div>
        <div class="progress-subtext" id="progSub">Writing SEO optimized content...</div>
        
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progFill"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let generatedArticles = [];

        async function startBulkGeneration() {
            const niche = document.getElementById('nicheInput').value.trim();
            const count = parseInt(document.getElementById('countSlider').value);
            const tone = document.getElementById('toneSelect').value;
            const lang = document.getElementById('langSelect').value;

            if (!niche) {
                alert("Please enter a Niche or Main Topic first.");
                return;
            }

            // UI Changes
            document.getElementById('startBtn').disabled = true;
            document.getElementById('progressOverlay').classList.add('active');
            const resultsGrid = document.getElementById('resultsGrid');
            resultsGrid.innerHTML = '';
            document.getElementById('downloadZipBtn').style.display = 'none';
            generatedArticles = [];

            const systemPrompt = `You are an elite, top-tier SEO blog writer. Your job is to write highly engaging, original, and structurally perfect blog articles.`;

            // Sequential Generation with VVIP Stabilization
            for (let i = 1; i <= count; i++) {
                updateProgress(i, count);
                
                const userPrompt = `Write a comprehensive, SEO-optimized blog article about "${niche}". 
                This is article number ${i} of a series. Make the angle unique compared to generic articles.
                Tone: ${tone}.
                Language: ${lang}.
                Format: Use HTML tags (<h1>, <h2>, <p>, <ul>) for structuring. Do NOT wrap the output in markdown code blocks like \`\`\`html. Just provide the raw HTML content.`;

                try {
                    // ⚡ VVIP FIX: Stable Request using the fast and reliable 70b model
                    const response = await fetch('/api/groq-handler', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            systemPrompt: systemPrompt,
                            userPrompt: userPrompt,
                            model: 'llama-3.3-70b-versatile' // Fastest & Stable
                        })
                    });

                    if (!response.ok) throw new Error("API Limit reached, retrying...");
                    
                    const data = await response.json();
                    let content = data.result;
                    
                    // Clean up markdown wrapping if the AI accidentally adds it
                    content = content.replace(/```html/g, '').replace(/```/g, '');

                    const title = `Article ${i}: ${niche} Insights`;
                    
                    generatedArticles.push({
                        title: title,
                        content: content
                    });

                    // Add to UI Grid dynamically
                    addArticleToGrid(title, content, i);

                    // 🛑 VVIP BUFFER: Wait 1.5 seconds between articles to prevent server timeout/rate limiting
                    await new Promise(resolve => setTimeout(resolve, 1500));

                } catch (error) {
                    console.error("Generation error on article " + i, error);
                    addArticleToGrid(`Article ${i} - FAILED`, `<p style="color: #ff4757;">Technical delay. The process will continue...</p>`, i);
                }
            }

            // Finish
            document.getElementById('progressOverlay').classList.remove('active');
            document.getElementById('startBtn').disabled = false;
            
            if(generatedArticles.length > 0) {
                document.getElementById('downloadZipBtn').style.display = 'flex';
            } else {
                alert("Generation failed. Please try again with a smaller batch.");
            }
        }

        function updateProgress(current, total) {
            document.getElementById('progText').innerText = `Generating ${current} of ${total}`;
            const percentage = (current / total) * 100;
            document.getElementById('progFill').style.width = percentage + '%';
        }

        function addArticleToGrid(title, content, index) {
            const grid = document.getElementById('resultsGrid');
            const div = document.createElement('div');
            div.className = 'article-card';
            
            // Extract a plain text snippet for preview
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            const plainText = tempDiv.textContent || tempDiv.innerText || "";
            const preview = plainText.substring(0, 200) + '...';

            div.innerHTML = `
                <div class="article-top">
                    <h3><i class="fa-solid fa-file-lines" style="margin-right: 8px;"></i> ${title}</h3>
                    <span class="status-badge">Ready</span>
                </div>
                <div class="article-preview">
                    ${preview}
                </div>
            `;
            grid.appendChild(div);
        }

        async function downloadAllAsZip() {
            if (generatedArticles.length === 0) return;

            const zip = new JSZip();
            const folder = zip.folder("ToolVerse_SEO_Articles");

            generatedArticles.forEach((article, index) => {
                // Create clean HTML file content
                const fileContent = `
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>${article.title}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px;">
${article.content}
</body>
</html>`;
                folder.file(`SEO_Article_${index + 1}.html`, fileContent);
            });

            // Generate ZIP and trigger download
            zip.generateAsync({ type: "blob" }).then(function(content) {
                saveAs(content, "ToolVerse_Bulk_Articles.zip");
            });
        }
    </script>

    <!-- VVIP UNIVERSAL UNLOCK SCRIPT -->
    <script>
        const isVVIPAuth = localStorage.getItem('ToolVerse_Auth') === 'true' || localStorage.getItem('isLoggedIn') === 'true';
        if (isVVIPAuth) {
            const unlockStyle = document.createElement('style');
            unlockStyle.innerHTML = `
                #authOverlay, #firebaseAuthModal, .auth-modal, #loginModal { 
                    display: none !important; opacity: 0 !important; pointer-events: none !important; z-index: -9999 !important; visibility: hidden !important;
                }
                body { overflow: auto !important; }
            `;
            document.head.appendChild(unlockStyle);
            window.isUserLoggedIn = true;
            setInterval(() => {
                const lockScreens = document.querySelectorAll('#authOverlay, #firebaseAuthModal, .auth-modal, #loginModal');
                lockScreens.forEach(lock => { if(lock) lock.style.display = 'none'; });
            }, 200);
        }
    </script>
</body>
</html>
