<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to PowerPoint - ToolVerse</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js for Reading PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- PptxGenJS for Creating PPTX -->
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>
    <style>
        .loader { 
            border-top-color: #f97316; 
            -webkit-animation: spinner 1.5s linear infinite; 
            animation: spinner 1.5s linear infinite; 
        }
        @keyframes spinner { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    
    <!-- Navbar -->
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold text-orange-600">ToolVerse</a>
            <a href="index.html" class="text-gray-600 hover:text-orange-600 transition font-medium">Back to Home</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-3xl mx-auto px-4 py-12">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">PDF to PowerPoint</h1>
            <p class="text-lg text-gray-600">Safely convert your PDF files into editable PowerPoint (PPTX) presentations right in your browser.</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8 border-t-4 border-orange-500">
            <!-- Upload Box -->
            <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-orange-500 transition-colors cursor-pointer bg-gray-50 hover:bg-orange-50">
                <svg class="mx-auto h-14 w-14 text-orange-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                <p class="text-gray-700 font-semibold text-lg">Click to upload or drag & drop your PDF</p>
                <p class="text-sm text-gray-500 mt-2">100% Secure. Files are not uploaded to any server.</p>
                <input type="file" id="fileInput" accept="application/pdf" class="hidden">
            </div>

            <!-- Progress Area -->
            <div id="progressArea" class="hidden mt-6 text-center py-8">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-16 w-16 mx-auto mb-6"></div>
                <p id="statusText" class="text-xl font-bold text-gray-800 mb-2">Preparing your file...</p>
                <p class="text-sm text-gray-500 mb-4">Please don't close this tab</p>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progressBar" class="bg-orange-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script / Logic -->
    <script>
        // Set up PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const progressArea = document.getElementById('progressArea');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');

        // Click to upload
        dropZone.addEventListener('click', () => fileInput.click());
        
        // Drag and drop styles
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-orange-500', 'bg-orange-50');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-orange-500', 'bg-orange-50');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-orange-500', 'bg-orange-50');
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        // File selected via click
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        async function processFile(file) {
            if (file.type !== 'application/pdf') {
                alert('عمران بھائی، براہ کرم صرف PDF فائل منتخب کریں!');
                return;
            }

            // UI Changes
            dropZone.classList.add('hidden');
            progressArea.classList.remove('hidden');
            progressBar.style.width = '0%';
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const totalPages = pdf.numPages;
                
                // Initialize PPTX Generator
                let pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9'; // Standard modern PPT size

                // Process each page
                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    statusText.innerText = `Converting Slide ${pageNum} of ${totalPages}...`;
                    progressBar.style.width = `${(pageNum / totalPages) * 100}%`;

                    const page = await pdf.getPage(pageNum);
                    // High quality render scale
                    const viewport = page.getViewport({ scale: 2.5 }); 
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
                    
                    // Convert canvas to image data
                    const imgData = canvas.toDataURL('image/jpeg', 0.85);
                    
                    // Add slide and paste image
                    let slide = pptx.addSlide();
                    slide.addImage({ data: imgData, x: 0, y: 0, w: '100%', h: '100%' });
                }

                statusText.innerText = 'Finalizing PPTX File...';
                
                // Save the file
                const outputFileName = file.name.replace('.pdf', '_ToolVerse.pptx');
                await pptx.writeFile({ fileName: outputFileName });

                statusText.innerText = 'Download Successful! 🎉';
                statusText.classList.add('text-green-600');
                
                // Reset UI after 3 seconds
                setTimeout(() => {
                    dropZone.classList.remove('hidden');
                    progressArea.classList.add('hidden');
                    statusText.classList.remove('text-green-600');
                    progressBar.style.width = '0%';
                    fileInput.value = '';
                }, 3000);

            } catch (error) {
                console.error(error);
                alert('Conversion failed. Please try again.');
                dropZone.classList.remove('hidden');
                progressArea.classList.add('hidden');
                fileInput.value = '';
            }
        }
    </script>
</body>
</html>
