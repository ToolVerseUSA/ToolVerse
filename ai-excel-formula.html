<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Excel Formula Generator | ToolVerse USA</title>
    <meta name="description" content="Generate complex Excel and Google Sheets formulas instantly using AI. Just type your problem and get the exact formula with explanations for free.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --border: rgba(51, 65, 85, 0.8);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            background-image: radial-gradient(circle at top right, rgba(139, 92, 246, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.05), transparent 40%);
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; }
        .logo { font-size: 24px; font-weight: 800; color: white; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .back-btn { color: var(--text-muted); text-decoration: none; font-size: 14px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; transition: 0.3s; }
        .back-btn:hover { background: var(--panel-bg); color: white; }
        .hero { text-align: center; margin-bottom: 50px; }
        .hero h1 { font-size: 42px; margin-bottom: 15px; background: linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-muted); font-size: 18px; max-width: 600px; margin: 0 auto; }
        .app-container { background: var(--panel-bg); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-group label { display: block; font-weight: 600; margin-bottom: 10px; color: #cbd5e1; }
        .prompt-box { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 16px; padding: 20px; color: white; font-size: 16px; min-height: 120px; resize: vertical; box-sizing: border-box; outline: none; font-family: inherit; transition: 0.3s; }
        .prompt-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
        .btn-generate { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #8b5cf6, #d946ef); color: white; border: none; padding: 16px 32px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; justify-content: center; margin-top: 20px; transition: 0.3s; box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4); }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.5); }
        .output-container { display: none; margin-top: 30px; animation: fadeIn 0.5s ease; }
        .formula-box { background: #020617; border: 1px solid var(--border); border-radius: 12px; padding: 20px; position: relative; font-family: monospace; font-size: 18px; color: #10b981; word-break: break-all; }
        .copy-btn { position: absolute; top: 15px; right: 15px; background: var(--panel-bg); border: 1px solid var(--border); color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .copy-btn:hover { background: white; color: black; }
        .explanation-box { background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-top: 15px; color: #cbd5e1; font-size: 15px; }
        .loader { display: none; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <header class="header">
        <a href="index.html" class="logo"><span>🚀 ToolVerse</span></a>
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Tools</a>
    </header>

    <main class="app-container">
        <textarea id="userPrompt" class="prompt-box" placeholder="Describe your Excel problem..."></textarea>
        <button id="generateBtn" class="btn-generate" onclick="generateFormulaWithGroq()">
            <span id="btnText"><i class="fa-solid fa-bolt"></i> Generate via Groq AI</span>
            <div id="loader" class="loader"></div>
        </button>

        <div id="outputContainer" class="output-container">
            <div class="formula-box"><span id="resultFormula"></span><button class="copy-btn" onclick="copyToClipboard()">Copy</button></div>
            <div class="explanation-box" id="resultExplanation"></div>
        </div>
    </main>
</div>

<script>
    function fillPrompt(text) { document.getElementById('userPrompt').value = text; }

    function highlightExcelSyntax(formula) {
        return formula
            .replace(/([A-Z0-9_]+)(?=\()/g, '<span style="color: #60a5fa; font-weight: bold;">$1</span>')
            .replace(/("[^"]*")/g, '<span style="color: #f43f5e;">$1</span>')
            .replace(/([A-Z]+[0-9]+(:[A-Z]+[0-9]+)?|[A-Z]+:[A-Z]+)/g, '<span style="color: #a78bfa;">$1</span>');
    }

    async function typeWriterEffect(elementId, text, speed = 10, isCode = false) {
        const element = document.getElementById(elementId);
        element.innerHTML = '';
        let i = 0;
        return new Promise((resolve) => {
            function type() {
                if (i < text.length) {
                    // Type plain text only during the loop
                    element.textContent = text.substring(0, i + 1);
                    i++;
                    setTimeout(type, speed);
                } else {
                    // Apply highlighting ONLY when finished
                    if(isCode) element.innerHTML = highlightExcelSyntax(text);
                    else element.innerHTML = text;
                    resolve();
                }
            }
            type();
        });
    }

    async function generateFormulaWithGroq() {
        const promptText = document.getElementById('userPrompt').value;
        if (!promptText.trim()) return alert("Please describe your Excel problem.");

        const btn = document.getElementById('generateBtn');
        btn.disabled = true;
        document.getElementById('btnText').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('outputContainer').style.display = 'none';

        try {
            const response = await fetch('/api/groq-handler', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    systemPrompt: "You are an expert Excel formula generator. Reply EXACTLY in this format: FORMULA: [formula] EXPLANATION: [explanation]",
                    userPrompt: promptText,
                    model: "qwen/qwen3.6-27b" 
                })
            });

            const data = await response.json();
            const rawResult = data.result || "";
            const parts = rawResult.split("EXPLANATION:");
            const finalFormula = parts[0].replace("FORMULA:", "").trim();
            const finalExplanation = parts[1] ? parts[1].trim() : "";

            btn.disabled = false;
            document.getElementById('btnText').style.display = 'inline-block';
            document.getElementById('loader').style.display = 'none';
            document.getElementById('outputContainer').style.display = 'block';
            
            await typeWriterEffect('resultFormula', finalFormula, 15, true);
            await typeWriterEffect('resultExplanation', finalExplanation, 5, false);

        } catch (error) {
            alert("Error: " + error.message);
            btn.disabled = false;
            document.getElementById('btnText').style.display = 'inline-block';
            document.getElementById('loader').style.display = 'none';
        }
    }

    function copyToClipboard() {
        navigator.clipboard.writeText(document.getElementById('resultFormula').textContent);
        alert("Copied!");
    }
</script>
</body>
</html>
