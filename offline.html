<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>ToolVerse is offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #07111f; color: #e2e8f0; }
    body { box-sizing: border-box; display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; background: radial-gradient(circle at 20% 0%, rgba(34, 211, 238, .12), transparent 35rem), #07111f; }
    main { width: min(34rem, 100%); padding: 2rem; border: 1px solid rgba(103, 232, 249, .22); border-radius: 1.25rem; background: rgba(15, 23, 42, .86); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .28); }
    .brand { color: #67e8f9; font-weight: 800; letter-spacing: .02em; }
    h1 { margin: 1rem 0 .75rem; color: #fff; font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.05; }
    p { color: #a8b6cc; line-height: 1.6; }
    a { display: inline-block; margin-top: .75rem; border-radius: .7rem; padding: .7rem 1rem; background: linear-gradient(135deg, #67e8f9, #a78bfa); color: #07111f; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">TV ToolVerse</div>
    <h1>ToolVerse is temporarily offline</h1>
    <p>Live services and the latest calculator content need a network connection. Reconnect and try again to continue.</p>
    <a href="/ToolVerse/">Try again</a>
  </main>
</body>
</html>
