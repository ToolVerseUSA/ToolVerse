<p class="disclaimer"><strong>100% private.</strong> UUIDs are generated entirely in your browser with cryptographic randomness — nothing is uploaded, stored, or sent anywhere.</p>
<section class="tool-card calculator-card">
<p class="section-label">Developer / Code</p>
<h2>Generate UUIDs (v4)</h2>
<p class="section-intro">Choose how many you need and generate a fresh set — one per line, ready to paste.</p>
<div class="form-section">
<label for="uu-count">How many (1–50)</label>
<input class="tv-field" id="uu-count" type="number" min="1" max="50" value="1" aria-label="Number of UUIDs to generate">
<label><input type="checkbox" id="uu-upper"> UPPERCASE letters</label>
<label><input type="checkbox" id="uu-hyphens" checked> Include hyphens</label>
<div class="tool-actions">
<button class="button" type="button" id="uu-copy">Copy all</button>
<button class="button primary" type="button" id="uu-gen">Generate</button>
</div>
<p class="form-error" id="uu-error" hidden aria-live="polite"></p>
</div>
<div class="tool-result" id="uu-result" aria-live="polite">
<h2>Your UUIDs</h2>
<textarea class="tv-field" id="uu-output" rows="6" readonly aria-label="Generated UUIDs" style="width:100%;min-height:130px"></textarea>
</div>
</section>
