<p class="disclaimer"><strong>100% private.</strong> Your text is processed entirely in your browser — nothing is uploaded, stored, or sent anywhere.</p>
<section class="tool-card calculator-card">
<p class="section-label">Developer / Code</p>
<h2>Encode or decode a URL</h2>
<p class="section-intro">Component mode is for a single value inside a query string. Full-URL mode keeps the structure of a whole URL intact.</p>
<div class="form-section">
<label for="ue-input">Your text</label>
<textarea class="tv-field" id="ue-input" rows="6" placeholder="Paste a URL or plain text here&hellip;" aria-label="Text to encode or decode" style="width:100%;min-height:130px"></textarea>
<label for="ue-mode">Mode</label>
<select class="tv-field" id="ue-mode" aria-label="Encode or decode mode">
<option value="component">Encode — URL component (value)</option>
<option value="full">Encode — full URL</option>
<option value="decode">Decode</option>
</select>
<div class="tool-actions">
<button class="button" type="button" id="ue-clear">Clear</button>
<button class="button" type="button" id="ue-copy">Copy result</button>
<button class="button primary" type="button" id="ue-run">Convert</button>
</div>
<p class="form-error" id="ue-error" hidden aria-live="polite"></p>
</div>
<div class="tool-result" id="ue-result" aria-live="polite">
<h2>Result</h2>
<textarea class="tv-field" id="ue-output" rows="6" readonly aria-label="Encoded or decoded result" style="width:100%;min-height:130px"></textarea>
</div>
</section>
