<p class="disclaimer"><strong>100% private &amp; fair.</strong> Every die is rolled with your browser's cryptographic RNG — nothing is uploaded or stored.</p>
<section class="tool-card calculator-card">
<p class="section-label">Generators</p>
<h2>Roll the dice</h2>
<p class="section-intro">Pick a die and how many to roll. Six-sided dice show real pips; larger dice show their number.</p>
<div class="form-section">
<label for="dr-sides">Die type</label>
<select class="tv-field" id="dr-sides" aria-label="Die type">
<option value="4">d4</option>
<option value="6" selected>d6 (standard)</option>
<option value="8">d8</option>
<option value="10">d10</option>
<option value="12">d12</option>
<option value="20">d20</option>
<option value="100">d100 (percentile)</option>
</select>
<label for="dr-count">Number of dice (1–10)</label>
<input class="tv-field" id="dr-count" type="number" min="1" max="10" value="2" aria-label="Number of dice">
<div class="tool-actions">
<button class="button" type="button" id="dr-clear-history">Clear history</button>
<button class="button primary" type="button" id="dr-roll">Roll dice</button>
</div>
<p class="form-error" id="dr-error" hidden aria-live="polite"></p>
</div>
<div class="tool-result" id="dr-result" aria-live="polite">
<h2>Result</h2>
<div class="dice-row" id="dr-dice"></div>
<p class="result-lede" id="dr-total">Press Roll dice to begin.</p>
<h3>History</h3>
<div id="dr-history"><p class="result-lede">No rolls yet.</p></div>
</div>
</section>
