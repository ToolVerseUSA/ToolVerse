<section class="tool-card calculator-card">

<h2>Make a URL slug</h2>
<p class="section-intro">Type a title or headline and get a clean URL slug instantly — lowercase, with accents removed and words joined by your separator.</p>
<div class="form-section">
<label for="sg-input">Title or headline</label>
