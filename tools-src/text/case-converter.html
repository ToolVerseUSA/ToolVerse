<p class="disclaimer"><strong>100% private.</strong> Your text is converted entirely in your browser — nothing is uploaded, stored, or sent anywhere.</p>
<section class="tool-card calculator-card">
<p class="section-label">Text &amp; Writing</p>
<h2>Change text case</h2>
<p class="section-intro">Paste text below and convert it between common case styles with one click.</p>
<div class="form-section">
<label for="cc-input">Your text</label>
<textarea id="cc-input" rows="6" placeholder="Type or paste your text here&hellip;" aria-label="Text to convert" style="width:100%"></textarea>
<div class="tool-actions">
<button class="button" type="button" data-cc="upper">UPPERCASE</button>
<button class="button" type="button" data-cc="lower">lowercase</button>
<button class="button" type="button" data-cc="title">Title Case</button>
<button class="button" type="button" data-cc="sentence">Sentence case</button>
<button class="button" type="button" data-cc="alternating">aLtErNaTiNg</button>
<button class="button primary" type="button" id="cc-copy">Copy</button>
</div>
<p class="form-error" id="cc-error" hidden aria-live="polite"></p>
</div>
<div class="tool-result" aria-live="polite">
<h2>Converted text</h2>
<pre id="cc-output" style="white-space:pre-wrap;word-break:break-word;min-height:60px" aria-label="Converted text output"></pre>
</div>
</section>
