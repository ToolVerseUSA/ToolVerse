<p class="disclaimer"><strong>100% private.</strong> Your image is processed entirely in your browser — nothing is uploaded, stored, or sent anywhere.</p>
<section class="tool-card calculator-card">
<p class="section-label">Image</p>
<h2>Compress an image</h2>
<p class="section-intro">Choose an image, set quality and max width, then download the smaller file.</p>
<div class="form-section">
<label for="ic-file">Image file (JPEG or PNG)</label>
<input id="ic-file" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Image file" style="width:100%;min-width:0">
<div class="tool-grid" style="margin-top:14px">
<label>Quality: <span id="ic-quality-label">80</span><input id="ic-quality" type="range" min="10" max="100" value="80" aria-label="JPEG quality"></label>
<label>Max width (px, 0 = keep original)<input id="ic-maxwidth" type="number" min="0" step="50" value="1600" aria-label="Max width in pixels"></label>
</div>
<div class="tool-actions"><button class="button primary" type="button" id="ic-compress">Compress</button></div>
<p class="form-error" id="ic-error" hidden aria-live="polite"></p>
</div>
<div class="tool-result" id="ic-result" aria-live="polite" hidden>
<h2>Result</h2>
<div class="result-grid">
<div class="result-grid-card"><h3>File sizes</h3><dl>
<div><dt>Original</dt><dd id="ic-orig-size">—</dd></div>
<div><dt>Compressed</dt><dd id="ic-new-size">—</dd></div>
<div><dt>Saved</dt><dd id="ic-saved">—</dd></div>
</dl></div>
</div>
<div class="tool-actions" style="margin-top:14px"><a class="button primary" id="ic-download" href="#" download="compressed.jpg">Download compressed image</a></div>
<p class="result-note" id="ic-note"></p>
</div>
</section>
