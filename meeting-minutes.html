<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Minutes AI - ToolVerse</title>
    <!-- PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            background: linear-gradient(to right, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 15px;
            outline: none;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit;
            margin-bottom: 15px;
        }
        textarea:focus {
            border-color: #a855f7;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }
        .main-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #9333ea, #db2777);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .main-btn:hover {
            transform: translateY(-2px);
        }
        #output-section {
            margin-top: 30px;
            display: none;
        }
        #pdf-content {
            padding: 20px;
            background: #1e293b;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .section-title {
            color: #ec4899;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }
        ul { padding-left: 20px; color: #cbd5e1; line-height: 1.6; }
        .action-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .action-table th, .action-table td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        .action-table th { color: #a855f7; }
        .action-table td { color: #f8fafc; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 20px; }
        .action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .copy-btn { background-color: #10b981; }
        .pdf-btn { background-color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <h1>Meeting Minutes AI</h1>
    <p class="subtitle">Paste your raw meeting notes, transcript, or rough points below.</p>
    
    <textarea id="raw-notes" placeholder="e.g., We discussed the Q3 marketing budget. Sarah will handle social media ads by Friday. John needs to approve the $5k spend. Do we need more budget for TikTok?"></textarea>
    <button id="generate-btn" class="main-btn" onclick="generateMinutes()">Generate Smart Minutes ⚡</button>

    <div id="output-section">
        <div id="pdf-content">
            <h2 style="text-align: center; color: #f8fafc; margin-bottom: 5px;">Executive Meeting Minutes</h2>
            <p style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 0;">Generated by ToolVerse AI</p>

            <div class="section-title">📊 Executive Summary</div>
            <p id="out-summary" style="color: #cbd5e1; font-size: 15px; line-height: 1.6;"></p>

            <div class="section-title">✅ Key Decisions Made</div>
            <ul id="out-decisions"></ul>

            <div class="section-title">🚀 Action Items</div>
            <table class="action-table">
                <thead><tr><th>Task Description</th><th>Assignee</th><th>Deadline</th></tr></thead>
                <tbody id="out-actions"></tbody>
            </table>

            <div class="section-title">❓ Open Questions</div>
            <ul id="out-questions"></ul>
        </div>

        <div class="action-buttons">
            <button class="action-btn copy-btn" onclick="copyMinutes()">📋 Copy Notes</button>
            <button class="action-btn pdf-btn" onclick="downloadPDF()">📄 Download PDF</button>
        </div>
    </div>
</div>

<script>
    async function generateMinutes() {
        const notes = document.getElementById('raw-notes').value;
        const btn = document.getElementById('generate-btn');
        const output = document.getElementById('output-section');
        
        if(!notes.trim()) { alert("Please paste some meeting notes first!"); return; }

        btn.innerText = "Analyzing Meeting Data... ⏳";
        btn.disabled = true;
        
        try {
            const response = await fetch('/api/minutes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ notes: notes })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            // Populate Summary
            document.getElementById('out-summary').innerText = data.summary;

            // Populate Decisions
            document.getElementById('out-decisions').innerHTML = data.decisions.map(d => `<li>${d}</li>`).join('');

            // Populate Action Items
            document.getElementById('out-actions').innerHTML = data.action_items.map(a => 
                `<tr><td>${a.task}</td><td><strong>${a.assignee}</strong></td><td>${a.deadline}</td></tr>`
            ).join('');

            // Populate Open Questions
            const questionsList = document.getElementById('out-questions');
            if (data.open_questions && data.open_questions.length > 0) {
                questionsList.innerHTML = data.open_questions.map(q => `<li>${q}</li>`).join('');
            } else {
                questionsList.innerHTML = `<li>No open questions.</li>`;
            }

            output.style.display = 'block';

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.innerText = "Generate Smart Minutes ⚡";
            btn.disabled = false;
        }
    }

    function copyMinutes() {
        const text = document.getElementById('pdf-content').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.innerText = "✅ Copied!";
            setTimeout(() => copyBtn.innerText = "📋 Copy Notes", 2000);
        });
    }

    function downloadPDF() {
        const element = document.getElementById('pdf-content');
        const pdfBtn = document.querySelector('.pdf-btn');
        pdfBtn.innerText = "⏳ Generating...";
        
        html2pdf().set({
            margin: 0.5,
            filename: 'Meeting_Minutes.pdf',
            html2canvas: { scale: 2, backgroundColor: '#1e293b' },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        }).from(element).save().then(() => {
            pdfBtn.innerText = "✅ Downloaded!";
            setTimeout(() => pdfBtn.innerText = "📄 Download PDF", 2000);
        });
    }
</script>

</body>
</html>
