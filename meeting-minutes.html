<body>

<div class="container">
    <a href="index.html" class="home-link">← Back to Home</a>
    <h1>Meeting Minutes AI</h1>
    <p class="subtitle">Paste your raw meeting notes, transcript, or rough points below.</p>
    
    <textarea id="raw-notes" placeholder="e.g., We discussed the Q3 marketing budget. Sarah will handle social media ads by Friday. John needs to approve the $5k spend. Do we need more budget for TikTok?"></textarea>
    <button id="generate-btn" class="main-btn" onclick="generateMinutes()">Generate Smart Minutes ⚡</button>

    <div id="output-section">
        <div id="pdf-content">
            <h2 style="text-align: center; color: #f8fafc; margin-bottom: 5px;">Executive Meeting Minutes</h2>
            <p style="text-align: center; color: #94a3b8; font-size: 12px; margin-top: 0;">Generated by ToolVerse AI</p>

            <div class="section-title">📊 Executive Summary</div>
            <p id="out-summary" style="color: #cbd5e1; font-size: 15px; line-height: 1.6;"></p>

            <div class="section-title">✅ Key Decisions Made</div>
            <ul id="out-decisions"></ul>

            <div class="section-title">🚀 Action Items</div>
            <table class="action-table">
                <thead><tr><th>Task Description</th><th>Assignee</th><th>Deadline</th></tr></thead>
                <tbody id="out-actions"></tbody>
            </table>

            <div class="section-title">❓ Open Questions</div>
            <ul id="out-questions"></ul>
        </div>

        <div class="action-buttons">
            <button class="action-btn copy-btn" onclick="copyMinutes()">📋 Copy Notes</button>
            <button class="action-btn pdf-btn" onclick="downloadPDF()">📄 Download PDF</button>
        </div>
    </div>
</div>

<script>
    async function generateMinutes() {
        const notes = document.getElementById('raw-notes').value.trim();
        const btn = document.getElementById('generate-btn');
        const output = document.getElementById('output-section');
        
        if(!notes) { alert("Please paste some meeting notes first!"); return; }

        // ==========================================
        // VVIP AUTH & FAST CREDIT CHECK (0ms Delay)
        // ==========================================
        const isAuth = localStorage.getItem('ToolVerse_Auth') === 'true' || localStorage.getItem('isLoggedIn') === 'true';
        if (!isAuth) {
            alert("🔒 Please login from the Dashboard to use Premium Tools.");
            window.location.href = "index.html";
            return;
        }

        let currentCredits = parseInt(localStorage.getItem('tv_agent_credits') || "0");
        if (currentCredits <= 0) {
            alert("🎁 You have run out of Credits!");
            document.getElementById('out-summary').innerHTML = "<span style='color: #ef4444;'>Insufficient Credits. Please upgrade in Dashboard.</span>";
            output.style.display = 'block';
            return; 
        }

        btn.innerText = "Analyzing Meeting Data... ⏳";
        btn.disabled = true;
        
        try {
            // Deduct 1 Credit instantly
            currentCredits -= 1; 
            localStorage.setItem('tv_agent_credits', currentCredits);

            // Using standardized groq-handler to maintain system architecture
            const systemPrompt = `You are an expert Executive Assistant. Analyze the provided meeting notes, transcript, or rough points and structure them into professional meeting minutes. 
            You MUST respond with ONLY a raw JSON object. Do not include any markdown formatting, backticks, or conversational text. 
            Use exactly this JSON structure:
            {
                "summary": "A brief 2-3 sentence executive summary of the meeting.",
                "decisions": ["Decision 1", "Decision 2"],
                "action_items": [
                    {"task": "Clear description of the task", "assignee": "Name or Role", "deadline": "Specific Date/Time or TBD"}
                ],
                "open_questions": ["Question 1", "Question 2"]
            }`;
            const userPrompt = `Meeting Notes:\n\n${notes}`;

            const response = await fetch('/api/groq-handler', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ systemPrompt, userPrompt })
            });

            const responseData = await response.json();
            if (!response.ok || !responseData.result) throw new Error(responseData.error || "Server Error: API did not respond properly.");

            // Clean up possible markdown added by AI and parse JSON
            let cleanJSON = responseData.result.replace(/```json/gi, '').replace(/```/g, '').trim();
            const data = JSON.parse(cleanJSON);

            // Populate Summary
            document.getElementById('out-summary').innerText = data.summary || "No summary available.";

            // Populate Decisions
            const decisionsList = document.getElementById('out-decisions');
            if (data.decisions && data.decisions.length > 0) {
                decisionsList.innerHTML = data.decisions.map(d => `<li>${d}</li>`).join('');
            } else {
                decisionsList.innerHTML = `<li>No specific decisions recorded.</li>`;
            }

            // Populate Action Items
            const actionsTable = document.getElementById('out-actions');
            if (data.action_items && data.action_items.length > 0) {
                actionsTable.innerHTML = data.action_items.map(a => 
                    `<tr><td>${a.task || "N/A"}</td><td><strong>${a.assignee || "Unassigned"}</strong></td><td>${a.deadline || "TBD"}</td></tr>`
                ).join('');
            } else {
                actionsTable.innerHTML = `<tr><td colspan="3">No action items assigned.</td></tr>`;
            }

            // Populate Open Questions
            const questionsList = document.getElementById('out-questions');
            if (data.open_questions && data.open_questions.length > 0) {
                questionsList.innerHTML = data.open_questions.map(q => `<li>${q}</li>`).join('');
            } else {
                questionsList.innerHTML = `<li>No open questions.</li>`;
            }

            output.style.display = 'block';

        } catch (error) {
            console.error("Meeting Minutes Error:", error);
            document.getElementById('out-summary').innerHTML = `<span style='color: #ef4444;'>⚠️ Error: ${error.message}</span>`;
            output.style.display = 'block';
        } finally {
            btn.innerText = "Generate Smart Minutes ⚡";
            btn.disabled = false;
        }
    }

    function copyMinutes() {
        const text = document.getElementById('pdf-content').innerText;
        navigator.clipboard.writeText(text).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.innerText = "✅ Copied!";
            setTimeout(() => copyBtn.innerText = "📋 Copy Notes", 2000);
        });
    }

    function downloadPDF() {
        const element = document.getElementById('pdf-content');
        const pdfBtn = document.querySelector('.pdf-btn');
        pdfBtn.innerText = "⏳ Generating...";
        pdfBtn.disabled = true;
        
        html2pdf().set({
            margin: 0.5,
            filename: 'Meeting_Minutes_ToolVerse.pdf',
            html2canvas: { scale: 2, backgroundColor: '#1e293b' },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        }).from(element).save().then(() => {
            pdfBtn.innerText = "✅ Downloaded!";
            setTimeout(() => {
                pdfBtn.innerText = "📄 Download PDF";
                pdfBtn.disabled = false;
            }, 2000);
        });
    }
</script>

<!-- VVIP UNIVERSAL UNLOCK SCRIPT -->
<script>
    const isVVIPAuth = localStorage.getItem('ToolVerse_Auth') === 'true' || localStorage.getItem('isLoggedIn') === 'true';
    if (isVVIPAuth) {
        const unlockStyle = document.createElement('style');
        unlockStyle.innerHTML = `
            #authOverlay, #firebaseAuthModal, .auth-modal, #loginModal { 
                display: none !important; opacity: 0 !important; pointer-events: none !important; z-index: -9999 !important; visibility: hidden !important;
            }
            body { overflow: auto !important; }
        `;
        document.head.appendChild(unlockStyle);
        window.isUserLoggedIn = true;
        setInterval(() => {
            const lockScreens = document.querySelectorAll('#authOverlay, #firebaseAuthModal, .auth-modal, #loginModal');
            lockScreens.forEach(lock => { if(lock) lock.style.display = 'none'; });
            window.isUserLoggedIn = true;
        }, 200);
    }
</script>
