<script type="module">
    // 1. Firebase SDKs کو امپورٹ کریں
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-analytics.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // 2. آپ کے ToolVerse پروجیکٹ کی بالکل درست کنفیگریشن
    const firebaseConfig = {
      apiKey: "AIzaSyAKYuPIPpwkSZOHQ9jc3OdsNitIDnEnAM8",
      authDomain: "toolverstoken.firebaseapp.com",
      projectId: "toolverstoken",
      storageBucket: "toolverstoken.firebasestorage.app",
      messagingSenderId: "762644487097",
      appId: "1:762644487097:web:dbd8d858e1dc6f3c1bb468",
      measurementId: "G-6VX2WPNECZ"
    };

    // 3. Firebase کو انیشلائز (Initialize) کریں
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 4. Google Login کا فنکشن (بٹن کے لیے)
    window.loginWithGoogle = function() {
        signInWithPopup(auth, provider)
        .then((result) => {
            const user = result.user;
            console.log("Login Successful!", user);
            // لاگ ان کامیاب ہونے کے بعد ہوم پیج پر ری ڈائریکٹ کریں
            window.location.href = "index.html"; 
        })
        .catch((error) => {
            console.error("Error during login:", error.message);
            alert("Google Sign-In Failed: " + error.message);
        });
    };

    // 5. Secure Sign-Out فنکشن (localStorage کلیئر کرنے کے ساتھ)
    window.logoutUser = function() {
        signOut(auth).then(() => {
            // یہ لائن پرانے یوزر کے مائننگ ٹوکنز اور تمام کچرے کو براؤزر سے مکمل ڈیلیٹ کر دے گی
            localStorage.clear(); 
            
            console.log("Logged out successfully.");
            // لاگ آؤٹ ہونے کے بعد واپس لاگ ان پیج پر ری ڈائریکٹ کریں
            window.location.href = "login.html";
        }).catch((error) => {
            console.error("Logout Error:", error.message);
        });
    };

    // 6. یوزر کا سٹیٹس چیک کرنے والا آبزرور (Optional but helpful)
    onAuthStateChanged(auth, (user) => {
        if (user) {
            console.log("Current active user:", user.email);
        } else {
            console.log("No user is currently logged in.");
        }
    });
</script>
