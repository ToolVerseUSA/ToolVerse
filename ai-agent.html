<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Automation Pro - ToolVerse</title>
    
    <!-- PrismJS for Syntax Highlighting -->
    <link href="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css)" rel="stylesheet" />
    <link href="[https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap](https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap)" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(139, 92, 246, 0.3); /* Neon Purple border */
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
        }
        h1 {
            text-align: center;
            background: linear-gradient(to right, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-size: 2.4rem;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        textarea, select {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }
        textarea:focus, select:focus {
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.25);
        }
        textarea { height: 130px; resize: vertical; }
        
        .main-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }
        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.6);
        }
        
        #output-section { display: none; margin-top: 35px; }
        
        .card-box {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .card-box h3 { margin-top: 0; color: #c084fc; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .card-box p, .card-box ul { color: #cbd5e1; font-size: 14px; line-height: 1.6; margin: 0; }
        
        /* IDE Window */
        .ide-header {
            background: #1e293b;
            border: 1px solid #334155;
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ide-dots span {
            display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 5px;
        }
        .copy-btn {
            background: #38bdf8; color: #0f172a; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .copy-btn:hover { background: #0ea5e9; }
        
        pre {
            margin: 0 !important;
            border-radius: 0 0 12px 12px !important;
            border: 1px solid #334155 !important;
            max-height: 450px;
            overflow-y: auto;
            white-space: pre-wrap !important;
            word-wrap: break-word !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 AI Agent Automation Pro</h1>
    <p class="subtitle">Deploy autonomous multi-step AI agent workflows to automate complex business & tech tasks.</p>
    
    <div class="input-group">
        <label>Select Execution Trigger</label>
        <select id="trigger-input">
            <option value="Event-Driven / Webhook">⚡ Event-Driven / Webhook Trigger</option>
            <option value="Cron / Scheduled (Hourly/Daily)">⏰ Cron / Scheduled (Hourly / Daily)</option>
            <option value="Manual / On-Demand Execution">👤 Manual / On-Demand Execution</option>
        </select>
    </div>

    <div class="input-group">
        <label>Describe your Automation Goal</label>
        <textarea id="goal-input" placeholder="e.g., Monitor competitor pricing on 3 websites every morning, extract prices, save them to a Google Sheet, and send a summary report to Slack..."></textarea>
    </div>
    
    <button id="generate-btn" class="main-btn" onclick="generateAgentWorkflow()">Deploy AI Agent Workflow 🚀</button>

    <div id="output-section">
        <div class="card-box" style="border-left: 4px solid #c084fc;">
            <h3>🧠 Agent Thought Process</h3>
            <p id="out-thought"></p>
        </div>

        <div class="card-box" style="border-left: 4px solid #38bdf8;">
            <h3 id="out-title">📋 Workflow Blueprint</h3>
            <div id="out-steps" style="white-space: pre-line;"></div>
        </div>

        <!-- IDE Window -->
        <div style="margin-bottom: 20px;">
            <div class="ide-header">
                <div class="ide-dots">
                    <span style="background: #ff5f56;"></span>
                    <span style="background: #ffbd2e;"></span>
                    <span style="background: #27c93f;"></span>
                </div>
                <span style="font-size: 12px; color: #94a3b8; font-weight: bold;">Agent Automation Engine (Node.js/Python)</span>
                <button class="copy-btn" onclick="copyAgentCode()">📋 Copy Script</button>
            </div>
            <pre><code id="out-code" class="language-javascript"></code></pre>
        </div>

        <div class="card-box" style="border-left: 4px solid #4ade80;">
            <h3>🛡️ Monitoring & Error Handling</h3>
            <p id="out-monitoring"></p>
        </div>
    </div>
</div>

<!-- PrismJS Scripts -->
<script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js)"></script>
<script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js)"></script>
<script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js)"></script>

<script>
    let rawAgentCode = "";

    async function generateAgentWorkflow() {
        const goal = document.getElementById('goal-input').value;
        const trigger = document.getElementById('trigger-input').value;
        const btn = document.getElementById('generate-btn');
        const outputSection = document.getElementById('output-section');
        
        if(!goal.trim()) { alert("Please describe your automation goal!"); return; }

        btn.innerText = "🤖 AI Agent is orchestrating workflow... ⏳";
        btn.disabled = true;
        btn.style.opacity = "0.7";
        outputSection.style.display = 'none';
        
        try {
            const response = await fetch('/api/agent', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ goal: goal, triggerType: trigger })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            document.getElementById('out-thought').innerText = data.thought;
            document.getElementById('out-title').innerText = "📋 " + data.title;
            document.getElementById('out-steps').innerText = data.steps;
            document.getElementById('out-monitoring').innerText = data.monitoring;
            
            rawAgentCode = data.code;
            const codeElement = document.getElementById('out-code');
            codeElement.textContent = data.code;
            
            Prism.highlightElement(codeElement);
            outputSection.style.display = 'block';

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.innerText = "Deploy AI Agent Workflow 🚀";
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }

    function copyAgentCode() {
        navigator.clipboard.writeText(rawAgentCode).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            copyBtn.innerText = "✅ Copied!";
            setTimeout(() => { copyBtn.innerText = "📋 Copy Script"; }, 2000);
        });
    }
</script>

</body>
</html>
