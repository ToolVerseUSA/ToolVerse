<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Background Remover (Server-Side) - ToolVerse</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script> window.isUserLoggedIn = true; </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKYuPIPpwkSZOHQ9jc3OdsNitIDnEnAM8",
            authDomain: "toolverstoken.firebaseapp.com",
            projectId: "toolverstoken",
            storageBucket: "toolverstoken.firebasestorage.app",
            messagingSenderId: "762644487097",
            appId: "1:762644487097:web:dbd8d858e1dc6f3c1bb468"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                document.getElementById('authOverlay').style.display = 'flex';
                window.isUserLoggedIn = false;
            } else {
                document.getElementById('authOverlay').style.display = 'none';
                window.isUserLoggedIn = true;
            }
        });
    </script>
    
    <style>
        .ilovepdf-red { background-color: #ef4444; }
        .ilovepdf-red:hover { background-color: #dc2626; }
        .loader { border-top-color: #ef4444; -webkit-animation: spinner 1s linear infinite; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { background-color: #f3f4f7; }
        .bg-checkered {
            background-color: #ffffff;
            background-image: linear-gradient(45deg, #e5e5e5 25%, transparent 25%), linear-gradient(-45deg, #e5e5e5 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e5e5 75%), linear-gradient(-45deg, transparent 75%, #e5e5e5 75%);
            background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="min-h-screen font-sans relative overflow-x-hidden">
    
    <div id="authOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-50 hidden flex-col justify-center items-center backdrop-blur-md">
        <div class="bg-white p-8 rounded-2xl text-center max-w-sm w-11/12 border-t-4 border-red-500">
            <h2 class="text-2xl font-bold mb-2">VVIP Premium Tool</h2>
            <p class="text-gray-600 mb-6">Login required for Cloud AI processing.</p>
            <a href="index.html" class="block w-full ilovepdf-red text-white font-bold py-3 px-4 rounded-xl">Go to Home</a>
        </div>
    </div>

    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="text-2xl font-extrabold text-gray-900">Tool<span class="text-red-500">Verse</span></a>
        </div>
    </nav>

    <div class="w-full flex-grow flex flex-col items-center justify-center pt-10 pb-10 px-4">
        <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg, image/webp" class="hidden">

        <!-- STEP 1 -->
        <div id="step1" class="w-full max-w-4xl mx-auto flex flex-col items-center text-center">
            <h1 class="text-4xl font-bold text-gray-800 mb-6">AI Cloud Background Remover</h1>
            <div class="cursor-pointer ilovepdf-red text-white text-2xl font-bold py-6 px-10 rounded-xl shadow-lg" onclick="triggerFileInput()">
                <i class="fa-solid fa-upload mr-3"></i> Upload Image
            </div>
        </div>

        <!-- STEP 2 -->
        <div id="step2" class="hidden w-full flex flex-col items-center mt-10">
            <img id="imagePreview" src="" alt="Preview" class="max-w-[300px] max-h-[300px] object-contain rounded shadow-xl bg-white p-2">
            <button onclick="startAI()" class="mt-8 ilovepdf-red text-white font-bold py-4 px-10 rounded-xl text-xl shadow-xl hover:bg-red-700">
                Start Cloud Processing <i class="fa-solid fa-cloud-arrow-up ml-2"></i>
            </button>
        </div>

        <!-- STEP 3 -->
        <div id="step3" class="hidden w-full flex flex-col items-center mt-20 text-center">
            <div class="loader rounded-full border-4 border-gray-200 h-20 w-20 mx-auto mb-8"></div>
            <h3 class="text-3xl font-bold text-gray-800">Processing on Cloud...</h3>
            <p id="loadingSubText" class="text-gray-500 mt-2">Uploading to ToolVerse Secure Server...</p>
            <div class="w-72 bg-gray-300 rounded-full h-2 mt-6">
                <div id="progressBar" class="ilovepdf-red h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- STEP 4 -->
        <div id="step4" class="hidden w-full max-w-5xl mx-auto flex flex-col items-center text-center mt-12">
            <h2 class="text-3xl font-bold text-gray-800 mb-8">Success!</h2>
            <div class="mb-10 p-4 bg-white shadow-2xl border border-gray-100 rounded-2xl">
                <img id="finalImage" src="" alt="Transparent Result" class="max-w-[350px] max-h-[350px] object-contain bg-checkered rounded-xl">
            </div>
            <div class="flex gap-4">
                <button onclick="resetTool()" class="bg-gray-700 text-white p-4 rounded-xl font-bold"><i class="fa-solid fa-arrow-rotate-left"></i></button>
                <button id="downloadBtn" class="ilovepdf-red text-white font-bold py-4 px-8 rounded-xl text-xl shadow-xl">Download HD Image</button>
            </div>
        </div>
    </div>

    <script>
        let uploadedFile = null;
        let finalImageBlobUrl = null;
        const fileInput = document.getElementById('fileInput');
        
        function triggerFileInput() {
            if(window.isUserLoggedIn === false) return document.getElementById('authOverlay').style.display = 'flex';
            fileInput.click();
        }

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadedFile = e.target.files[0];
                document.getElementById('imagePreview').src = URL.createObjectURL(uploadedFile);
                showStep(2);
            }
        });

        function showStep(stepNumber) {
            [1, 2, 3, 4].forEach(n => document.getElementById(`step${n}`).classList.add('hidden'));
            document.getElementById(`step${stepNumber}`).classList.remove('hidden');
        }

        function resetTool() {
            uploadedFile = null;
            if(finalImageBlobUrl) URL.revokeObjectURL(finalImageBlobUrl);
            fileInput.value = '';
            document.getElementById('progressBar').style.width = '0%';
            showStep(1); 
        }

        async function startAI() {
            showStep(3); 
            const progressBar = document.getElementById('progressBar');
            const subText = document.getElementById('loadingSubText');
            
            try {
                subText.innerText = "Preparing Image...";
                progressBar.style.width = '20%';

                const reader = new FileReader();
                reader.readAsDataURL(uploadedFile);
                
                reader.onload = async () => {
                    const base64Image = reader.result;
                    progressBar.style.width = '50%';
                    subText.innerText = "Sending to Server API (Zero Load on Mobile)...";

                    // ==========================================
                    // SERVER CALL (Hits your Vercel Backend)
                    // ==========================================
                    const response = await fetch('/api/bg-remover', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ imageBase64: base64Image })
                    });

                    let data;
                    try {
                        data = await response.json();
                    } catch(e) {
                        throw new Error("Server API failed to respond properly. Check your /api/bg-remover.js file.");
                    }

                    if (!data.success) {
                        throw new Error(data.error || "Server rejected the image.");
                    }

                    progressBar.style.width = '100%';
                    subText.innerText = "Done!";
                    finalImageBlobUrl = data.result;
                    document.getElementById('finalImage').src = finalImageBlobUrl;
                    
                    document.getElementById('downloadBtn').onclick = () => {
                        const a = document.createElement('a');
                        a.href = finalImageBlobUrl;
                        a.download = uploadedFile.name.replace(/\.[^/.]+$/, "") + '_ToolVerse_HD.png';
                        a.click();
                    };

                    setTimeout(() => { showStep(4); }, 500);
                };

                reader.onerror = () => { throw new Error("Failed to read image."); };

            } catch (error) {
                console.error("Cloud Error:", error);
                alert("Cloud Server Alert: " + error.message);
                resetTool();
            }
        }
    </script>
</body>
</html>
