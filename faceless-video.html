<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faceless Video Blueprint | Premium ToolVerse</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* VVIP Specific Styles for this Tool */
        .blueprint-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
        .input-card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .output-card { background: #0f172a; padding: 30px; border-radius: 16px; color: #f8fafc; box-shadow: 0 15px 40px rgba(0,0,0,0.15); position: relative; }
        .output-card h3 { color: #38bdf8; margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        .script-content { font-family: 'Courier New', Courier, monospace; line-height: 1.6; font-size: 15px; margin-top: 20px; white-space: pre-wrap; height: 500px; overflow-y: auto; }
        .visual-cue { color: #facc15; font-weight: bold; } /* To highlight visual ideas */
        .copy-btn-dark { position: absolute; top: 20px; right: 20px; background: #334155; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .copy-btn-dark:hover { background: #475569; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; font-size: 14px;}
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px;}
        .form-group textarea { resize: vertical; }
        .premium-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);}
        .premium-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4); }
        .premium-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none;}
        
        @media (max-width: 768px) { .blueprint-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <!-- Your existing ToolVerse Header goes here -->
    </header>

    <section class="tool-header" style="text-align: center; padding: 60px 20px; background: linear-gradient(to right, #f8fafc, #f1f5f9);">
        <h1 style="font-size: 2.5rem; color: #0f172a; margin-bottom: 10px;">🎭 Faceless Video Blueprint</h1>
        <p style="color: #475569; font-size: 1.1rem;">Generate high-retention scripts, hooks, and visual cues for your next viral video.</p>
    </section>

    <div class="blueprint-container">
        <!-- Left Side: Inputs -->
        <div class="input-card">
            <div class="form-group">
                <label>Main Topic / Idea</label>
                <input type="text" id="videoTopic" placeholder="e.g. The mysterious disappearance of Roanoke...">
            </div>
            
            <div class="form-group">
                <label>Channel Niche</label>
                <select id="videoNiche">
                    <option value="Storytelling & Lore">Storytelling & Lore</option>
                    <option value="Educational & Language">Educational & Language Learning</option>
                    <option value="Tech & AI">Tech & AI</option>
                    <option value="Finance & Business">Finance & Business</option>
                    <option value="Mystery & True Crime">Mystery & True Crime</option>
                </select>
            </div>

            <div class="form-group">
                <label>Target Video Length</label>
                <select id="videoLength">
                    <option value="YouTube Shorts (60 seconds)">YouTube Shorts (60 sec)</option>
                    <option value="Short Form (3-5 mins)">Short Form (3-5 mins)</option>
                    <option value="Long Form (8-10 mins)">Long Form (8-10 mins)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tone of Voice</label>
                <select id="videoTone">
                    <option value="Suspenseful and Gripping">Suspenseful & Gripping</option>
                    <option value="Calm, Clear, and Educational">Calm & Educational</option>
                    <option value="Energetic and Fast-paced">Energetic & Fast</option>
                </select>
            </div>

            <div class="form-group">
                <label>Any Specific Details or Key Points?</label>
                <textarea id="videoDetails" rows="3" placeholder="Add specific facts, keywords, or structure you want included..."></textarea>
            </div>

            <button class="premium-btn" id="generateBlueprintBtn">🚀 Generate Blueprint</button>
        </div>

        <!-- Right Side: Output Studio -->
        <div class="output-card">
            <button class="copy-btn-dark" id="copyBtn">📋 Copy Script</button>
            <h3>🎬 Your Studio Blueprint</h3>
            <div class="script-content" id="outScript">
                <span style="color: #64748b; font-style: italic;">Provide your details on the left and click generate to see the magic happen. The AI will provide Title ideas, a Hook, Voiceover Script, and Visual instructions...</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- App Logic -->
    <script src="faceless-video.js"></script>

</body>
</html>
