    <div class="blueprint-container">
        <!-- Left Side: Inputs -->
        <div class="input-card">
            <div class="form-group">
                <label>Main Topic / Idea</label>
                <input type="text" id="videoTopic" placeholder="e.g. The mysterious disappearance of Roanoke...">
            </div>
            
            <div class="form-group">
                <label>Channel Niche</label>

                    <option value="Educational & Language">Educational & Language Learning</option>
                    <option value="Tech & AI">Tech & AI</option>
                    <option value="Finance & Business">Finance & Business</option>
                    <option value="Mystery & True Crime">Mystery & True Crime</option>
                </select>
            </div>

            <div class="form-group">
                <label>Target Video Length</label>
                <select id="videoLength">
                    <option value="YouTube Shorts (60 seconds)">YouTube Shorts (60 sec)</option>
                    <option value="Short Form (3-5 mins)">Short Form (3-5 mins)</option>
                    <option value="Long Form (8-10 mins)">Long Form (8-10 mins)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tone of Voice</label>
                <select id="videoTone">
                    <option value="Suspenseful and Gripping">Suspenseful & Gripping</option>
                    <option value="Calm, Clear, and Educational">Calm & Educational</option>
                    <option value="Energetic and Fast-paced">Energetic & Fast</option>
                </select>
            </div>

            <div class="form-group">
                <label>Any Specific Details or Key Points?</label>

            </div>

            <button class="premium-btn" id="generateBlueprintBtn">🚀 Generate Blueprint</button>
        </div>

        <!-- Right Side: Output Studio -->

            </div>
        </div>

    <!-- VVIP UNIVERSAL UNLOCK SCRIPT -->
    <script>
        const isVVIPAuth = localStorage.getItem('ToolVerse_Auth') === 'true' || localStorage.getItem('isLoggedIn') === 'true';
        if (isVVIPAuth) {
            const unlockStyle = document.createElement('style');
            unlockStyle.innerHTML = `
                #authOverlay, #firebaseAuthModal, .auth-modal, #loginModal { 
                    display: none !important; opacity: 0 !important; pointer-events: none !important; z-index: -9999 !important; visibility: hidden !important;
                }
                body { overflow: auto !important; }
            `;
            document.head.appendChild(unlockStyle);
            window.isUserLoggedIn = true;
            setInterval(() => {
                const lockScreens = document.querySelectorAll('#authOverlay, #firebaseAuthModal, .auth-modal, #loginModal');
                lockScreens.forEach(lock => { if(lock) lock.style.display = 'none'; });
                window.isUserLoggedIn = true;
            }, 200);
        }
    </script>
