<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Generator | Premium ToolVerse</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* VVIP Specific Styles for Prompt Generator */
        .prompt-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
        .input-card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .output-card { background: #0f172a; padding: 30px; border-radius: 16px; color: #f8fafc; box-shadow: 0 15px 40px rgba(0,0,0,0.15); position: relative; }
        .output-card h3 { color: #22d3ee; margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        
        .prompt-content { font-family: 'Courier New', Courier, monospace; line-height: 1.7; font-size: 15px; margin-top: 20px; white-space: pre-wrap; height: 500px; overflow-y: auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        
        .copy-btn-dark { position: absolute; top: 20px; right: 20px; background: #0891b2; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.3s; }
        .copy-btn-dark:hover { background: #0e7490; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; font-size: 14px;}
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff;}
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1); }
        .form-group textarea { resize: vertical; }
        
        .premium-btn { background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3);}
        .premium-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4); }
        .premium-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none;}
        
        @media (max-width: 768px) { .prompt-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="container" style="padding: 20px 0; display:flex; justify-content:space-between; align-items:center;">
            <div class="logo" style="font-weight:bold; font-size:24px;">🚀 ToolVerse</div>
            <a href="index.html" style="text-decoration:none; color:#333; font-weight:500;">Back to Home</a>
        </div>
    </header>

    <section class="tool-header" style="text-align: center; padding: 60px 20px; background: linear-gradient(to right, #ecfeff, #cffafe);">
        <h1 style="font-size: 2.5rem; color: #164e63; margin-bottom: 10px;">💡 AI Prompt Generator</h1>
        <p style="color: #0891b2; font-size: 1.1rem;">Turn your basic ideas into master-level, highly optimized prompts for any AI.</p>
    </section>

    <div class="prompt-container">
        <!-- Left Side: Inputs -->
        <div class="input-card">
            <div class="form-group">
                <label>What do you want the AI to do?</label>
                <textarea id="promptIdea" rows="3" placeholder="e.g. Write a blog post about healthy eating, or Generate an image of a futuristic city..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Target AI Model</label>
                <select id="aiModel">
                    <option value="Text Generation (ChatGPT, Claude, Llama)">Text Generation (ChatGPT, Claude, Llama)</option>
                    <option value="Image Generation (Midjourney, DALL-E, Stable Diffusion)">Image Generation (Midjourney, DALL-E)</option>
                    <option value="Code Generation (GitHub Copilot, GPT-4)">Code Generation (Coding & Tech)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Act As (Persona)</label>
                <select id="persona">
                    <option value="Expert Consultant">Expert Consultant</option>
                    <option value="Creative Storyteller">Creative Storyteller</option>
                    <option value="Senior Software Engineer">Senior Software Engineer</option>
                    <option value="Professional Copywriter">Professional Copywriter</option>
                    <option value="Direct & Objective Assistant">Direct & Objective Assistant</option>
                </select>
            </div>

            <div class="form-group">
                <label>Output Tone</label>
                <select id="promptTone">
                    <option value="Professional and Authoritative">Professional & Authoritative</option>
                    <option value="Engaging and Conversational">Engaging & Conversational</option>
                    <option value="Creative and Imaginative">Creative & Imaginative</option>
                    <option value="Highly Technical and Precise">Highly Technical</option>
                </select>
            </div>

            <button class="premium-btn" id="generatePromptBtn">✨ Generate Super Prompt</button>
        </div>

        <!-- Right Side: Output Studio -->
        <div class="output-card">
            <button class="copy-btn-dark" id="copyBtn">📋 Copy Prompt</button>
            <h3>🎯 Your Engineered Prompt</h3>
            <div class="prompt-content" id="outPrompt">
                <span style="color: #64748b; font-style: italic;">Enter your basic idea on the left and click generate. Watch as we engineer a mega-prompt designed to get the perfect response from any AI...</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- App Logic -->
    <script src="prompt-generator.js"></script>

</body>
</html>
