    <a href="index.html" class="home-link">← Back to Home</a>

<div class="container">
    <h1>🗄️ <span class="gradient-text">SQL Query AI Pro</span></h1>
    <p class="subtitle">Generate complex, optimized database queries from simple English.</p>
    
    <div class="db-selector" id="db-selector">
        <button class="db-btn active" onclick="selectDB(this, 'MySQL / MariaDB')">MySQL</button>
        <button class="db-btn" onclick="selectDB(this, 'PostgreSQL')">PostgreSQL</button>
        <button class="db-btn" onclick="selectDB(this, 'SQL Server (T-SQL)')">SQL Server</button>
        <button class="db-btn" onclick="selectDB(this, 'MongoDB (NoSQL)')">MongoDB</button>
        <button class="db-btn" onclick="selectDB(this, 'SQLite')">SQLite</button>
    </div>

    <div class="input-group">
        <label>Database Context / Table Schema <span class="optional-tag">Optional</span></label>
        <textarea id="schema-input" style="height: 70px;" placeholder="e.g., users(id, name, email, plan_id), plans(id, price) - Helps AI use exact column names"></textarea>
    </div>

    <div class="input-group">
        <label>What data do you want to query?</label>
        <textarea id="desc-input" style="height: 100px;" placeholder="e.g., Get the names and emails of all users who purchased a plan greater than $50 in the last 30 days..."></textarea>
    </div>
    
    <button id="generate-btn" class="main-btn" onclick="generateQuery()">Generate Optimized Query ⚡</button>

    <div id="output-section">
        <div class="ide-header">
            <span style="font-size: 13px; color: #94a3b8; font-weight: bold;">Generated Query</span>
            <button class="copy-btn" onclick="copyQuery()">📋 Copy Code</button>
        </div>
        <pre><code id="out-query" class="language-sql"></code></pre>

        <div class="explanation-box">
            <h3>🧠 Query Breakdown & Optimization</h3>
            <div id="out-explanation" style="white-space: pre-line;"></div>
        </div>
    </div>
</div>

<!-- PrismJS Scripts -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script> <!-- For MongoDB -->

<script>
    let selectedDB = "MySQL / MariaDB";
    let rawQuery = "";

    function selectDB(btn, dbName) {
        document.querySelectorAll('.db-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDB = dbName;
    }

    async function generateQuery() {
        const desc = document.getElementById('desc-input').value.trim();
        const schema = document.getElementById('schema-input').value.trim();
        const btn = document.getElementById('generate-btn');
        const outputSection = document.getElementById('output-section');
        
        if(!desc) { alert("Please describe the query you want to build!"); return; }

        // ==========================================
        // VVIP AUTH & FAST CREDIT CHECK (0ms Delay)
        // ==========================================
        const isAuth = localStorage.getItem('ToolVerse_Auth') === 'true' || localStorage.getItem('isLoggedIn') === 'true';
        if (!isAuth) {
            alert("🔒 Please login from the Dashboard to use Premium AI Tools.");
            window.location.href = "index.html";
            return;
        }

        let currentCredits = parseInt(localStorage.getItem('tv_agent_credits') || "0");
        if (currentCredits <= 0) {
            alert("🎁 You have run out of Credits! Please upgrade in Dashboard.");
            return; 
        }

        btn.innerText = "🗄️ AI is architecting your query... ⏳";
        btn.disabled = true;
        btn.style.opacity = "0.7";
        outputSection.style.display = 'none';
        
        try {
            // Deduct 1 Credit instantly
            currentCredits -= 1; 
            localStorage.setItem('tv_agent_credits', currentCredits);

            // Strict JSON prompt for Groq Handler
            const systemPrompt = `You are an elite Database Architect and SQL/NoSQL Expert. Generate an optimized database query based on the user's description.
            You MUST respond with ONLY a raw JSON object. Do not include any markdown formatting like \`\`\`json, backticks, or conversational text outside the JSON.
            Use exactly this JSON structure:
            {
                "query": "The exact raw code for the query (SQL or MongoDB syntax based on request)",
                "explanation": "A step-by-step text breakdown of how the query works and why it is optimized."
            }`;
            
            const userPrompt = `Database Type: ${selectedDB}\nSchema Context: ${schema || 'None provided'}\nDescription: ${desc}`;

            const response = await fetch('/api/groq-handler', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ systemPrompt, userPrompt })
            });

            const responseData = await response.json();
            if (!response.ok || !responseData.result) throw new Error(responseData.error || "Server Error: API did not respond properly.");

            // Clean up possible markdown added by AI and parse JSON
            let cleanJSON = responseData.result.replace(/```json/gi, '').replace(/```/g, '').trim();
            const data = JSON.parse(cleanJSON);

            rawQuery = data.query;
            document.getElementById('out-explanation').innerText = data.explanation;
            
            const codeElement = document.getElementById('out-query');
            codeElement.textContent = rawQuery;
            
            // Syntax Highlighting Class (SQL vs MongoDB JS syntax)
            codeElement.className = selectedDB.includes("Mongo") ? "language-javascript" : "language-sql";
            
            if (window.Prism) {
                Prism.highlightElement(codeElement);
            }
            
            outputSection.style.display = 'block';

        } catch (error) {
            console.error("SQL Query Builder Error:", error);
            alert("Error: " + error.message);
        } finally {
            btn.innerText = "Generate Optimized Query ⚡";
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }

    function copyQuery() {
        if (!rawQuery) return;
        navigator.clipboard.writeText(rawQuery).then(() => {
            const btn = document.querySelector('.copy-btn');
            const orig = btn.innerText;
            btn.innerText = "✅ Copied!";
            btn.style.background = "#34d399";
            btn.style.color = "#0f172a";
            setTimeout(() => { 
                btn.innerText = orig; 
                btn.style.background = "#10b981";
            }, 2000);
        });
    }
</script>
