<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Query AI Pro - ToolVerse</title>
    
    <!-- PrismJS for SQL Syntax Highlighting -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050b14; /* Deep dark blue/black */
            color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(16, 185, 129, 0.3); /* Emerald border */
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 950px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
        }
        h1 {
            text-align: center;
            background: linear-gradient(to right, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            font-size: 2.4rem;
        }
        p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; }
        
        /* Database Selectors */
        .db-selector { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; justify-content: center; }
        .db-btn {
            background: rgba(30, 41, 59, 0.8); border: 1px solid #334155;
            color: #cbd5e1; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .db-btn.active {
            background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        .db-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.05); }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #cbd5e1; font-size: 0.9rem; }
        .optional-tag { font-size: 0.75rem; background: #334155; padding: 2px 6px; border-radius: 4px; color: #94a3b8; margin-left: 5px;}
        
        textarea {
            width: 100%; padding: 16px; border-radius: 10px; border: 1px solid #334155;
            background-color: #0f172a; color: #fff; font-size: 15px; outline: none; box-sizing: border-box;
            font-family: inherit; transition: 0.3s; resize: vertical;
        }
        textarea:focus { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        
        .main-btn {
            width: 100%; padding: 18px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%); color: white;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 20px rgba(5, 150, 105, 0.4);
        }
        .main-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(5, 150, 105, 0.6); }
        
        #output-section { display: none; margin-top: 35px; }
        
        .ide-header {
            background: #1e293b; border: 1px solid #334155; border-bottom: none; border-radius: 12px 12px 0 0;
            padding: 12px 18px; display: flex; justify-content: space-between; align-items: center;
        }
        pre { margin: 0 !important; border-radius: 0 0 12px 12px !important; border: 1px solid #334155 !important; }
        .copy-btn { background: #10b981; color: #0f172a; border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: #34d399; }

        .explanation-box {
            background: rgba(30, 41, 59, 0.6); border: 1px solid #334155; border-left: 4px solid #3b82f6;
            padding: 20px; border-radius: 12px; margin-top: 20px;
        }
        .explanation-box h3 { margin-top: 0; color: #3b82f6; font-size: 1.1rem; }
        .explanation-box div { color: #cbd5e1; font-size: 14px; line-height: 1.7; }
    </style>
</head>
<body>

<div class="container">
    <h1><span style="-webkit-text-fill-color: initial;">🗄️</span> SQL Query AI Pro</h1>
    <p class="subtitle">Generate complex, optimized database queries from simple English.</p>
    
    <div class="db-selector" id="db-selector">
        <button class="db-btn active" onclick="selectDB(this, 'MySQL / MariaDB')">MySQL</button>
        <button class="db-btn" onclick="selectDB(this, 'PostgreSQL')">PostgreSQL</button>
        <button class="db-btn" onclick="selectDB(this, 'SQL Server (T-SQL)')">SQL Server</button>
        <button class="db-btn" onclick="selectDB(this, 'MongoDB (NoSQL)')">MongoDB</button>
        <button class="db-btn" onclick="selectDB(this, 'SQLite')">SQLite</button>
    </div>

    <div class="input-group">
        <label>Database Context / Table Schema <span class="optional-tag">Optional</span></label>
        <textarea id="schema-input" style="height: 70px;" placeholder="e.g., users(id, name, email, plan_id), plans(id, price) - Helps AI use exact column names"></textarea>
    </div>

    <div class="input-group">
        <label>What data do you want to query?</label>
        <textarea id="desc-input" style="height: 100px;" placeholder="e.g., Get the names and emails of all users who purchased a plan greater than $50 in the last 30 days..."></textarea>
    </div>
    
    <button id="generate-btn" class="main-btn" onclick="generateQuery()">Generate Optimized Query ⚡</button>

    <div id="output-section">
        <div class="ide-header">
            <span style="font-size: 13px; color: #94a3b8; font-weight: bold;">Generated Query</span>
            <button class="copy-btn" onclick="copyQuery()">📋 Copy Code</button>
        </div>
        <pre><code id="out-query" class="language-sql"></code></pre>

        <div class="explanation-box">
            <h3>🧠 Query Breakdown & Optimization</h3>
            <div id="out-explanation" style="white-space: pre-line;"></div>
        </div>
    </div>
</div>

<!-- PrismJS Scripts -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script> <!-- For MongoDB -->

<script>
    let selectedDB = "MySQL / MariaDB";
    let rawQuery = "";

    function selectDB(btn, dbName) {
        document.querySelectorAll('.db-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDB = dbName;
    }

    async function generateQuery() {
        const desc = document.getElementById('desc-input').value;
        const schema = document.getElementById('schema-input').value;
        const btn = document.getElementById('generate-btn');
        const outputSection = document.getElementById('output-section');
        
        if(!desc.trim()) { alert("Please describe the query you want to build!"); return; }

        btn.innerText = "🗄️ AI is architecting your query... ⏳";
        btn.disabled = true;
        btn.style.opacity = "0.7";
        outputSection.style.display = 'none';
        
        try {
            const response = await fetch('/api/sql-tool', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    description: desc,
                    dbType: selectedDB,
                    schemaContext: schema
                })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error);

            rawQuery = data.query;
            document.getElementById('out-explanation').innerText = data.explanation;
            
            const codeElement = document.getElementById('out-query');
            codeElement.textContent = rawQuery;
            
            // Syntax Highlighting Class (SQL vs MongoDB JS syntax)
            codeElement.className = selectedDB.includes("Mongo") ? "language-javascript" : "language-sql";
            
            if (window.Prism) {
                Prism.highlightElement(codeElement);
            }
            
            outputSection.style.display = 'block';

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.innerText = "Generate Optimized Query ⚡";
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }

    function copyQuery() {
        navigator.clipboard.writeText(rawQuery).then(() => {
            const btn = document.querySelector('.copy-btn');
            btn.innerText = "✅ Copied!";
            setTimeout(() => { btn.innerText = "📋 Copy Code"; }, 2000);
        });
    }
</script>

</body>
</html>
