<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can I Afford This? | US Financial Decision Engine</title>
    <meta name="description" content="Calculate if you can afford your lifestyle in any US city. Real-time cost of living analyzer for smarter financial decisions.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <div class="max-w-2xl mx-auto mt-10 p-6">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500 mb-4">Can I Afford This?</h1>
            <p class="text-slate-400 text-lg">Calculate your real financial score in seconds.</p>
        </div>

        <!-- Calculator Card -->
        <div class="glass p-8 rounded-3xl shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="text-sm text-slate-400">Annual Salary ($)</label>
                    <input type="number" id="salary" class="w-full mt-2 p-4 bg-slate-900 rounded-xl border border-slate-700 text-white outline-none focus:ring-2 focus:ring-cyan-500" placeholder="e.g. 75000">
                </div>
                <div>
                    <label class="text-sm text-slate-400">Monthly Rent ($)</label>
                    <input type="number" id="rent" class="w-full mt-2 p-4 bg-slate-900 rounded-xl border border-slate-700 text-white outline-none focus:ring-2 focus:ring-cyan-500" placeholder="e.g. 2000">
                </div>
            </div>
            
            <button onclick="analyze()" class="w-full mt-8 p-4 bg-gradient-to-r from-cyan-600 to-purple-600 rounded-xl font-bold text-lg hover:opacity-90 transition">
                Generate My Financial Score 📊
            </button>
        </div>

        <!-- Result Section -->
        <div id="result" class="hidden mt-8 glass p-8 rounded-3xl text-center animate-in fade-in zoom-in duration-500">
            <h2 class="text-2xl font-bold text-white mb-6">Your Financial Health</h2>
            <div class="flex justify-center mb-6">
                <div id="score-circle" class="w-40 h-40 rounded-full border-8 border-cyan-500 flex items-center justify-center text-4xl font-bold text-cyan-400">0</div>
            </div>
            <p id="analysis" class="text-slate-300 text-lg mb-6"></p>
            <button onclick="shareResult()" class="w-full p-3 bg-slate-700 rounded-xl hover:bg-slate-600 transition">Share My Score 📤</button>
        </div>
    </div>

    <script>
        function analyze() {
            const salary = parseFloat(document.getElementById('salary').value);
            const rent = parseFloat(document.getElementById('rent').value);
            
            if(!salary || !rent) return alert("Please fill both fields!");

            const monthlyIncome = salary / 12;
            const rentRatio = (rent / monthlyIncome) * 100;
            let score = Math.max(0, Math.min(100, Math.round(100 - (rentRatio))));
            
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('score-circle').innerText = score;
            
            let message = rentRatio > 35 ? "Warning: Your housing costs are too high. Consider downsizing." : "Great! Your housing ratio is healthy.";
            document.getElementById('analysis').innerText = message;
        }

        function shareResult() {
            alert("Score copied to clipboard! Share it on social media.");
        }
    </script>
</body>
</html>
