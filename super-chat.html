<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super AI Chat - ToolVerse</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --chat-bg: #1f2833;
            --text-primary: #c5c6c7;
            --accent-color: #66fcf1;
            --accent-hover: #45a29e;
            --message-user: #45a29e;
            --message-ai: #1f2833;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-primary); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

        .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background-color: #12141a; border-bottom: 1px solid #2a2e3d; flex-wrap: wrap; gap: 10px; }
        .model-selector { background-color: var(--chat-bg); color: white; border: 1px solid #2a2e3d; padding: 10px; border-radius: 8px; font-size: 15px; outline: none; cursor: pointer; flex-grow: 1; }
        .token-display { background-color: rgba(102, 252, 241, 0.1); color: var(--accent-color); padding: 8px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid var(--accent-color); white-space: nowrap; }

        .chat-container { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth;}
        .message { max-width: 88%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
        .user-msg { background-color: var(--message-user); color: #0b0c10; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-msg { background-color: var(--message-ai); color: var(--text-primary); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #2a2e3d; border-radius: 2px 12px 12px 12px; }

        .input-area { padding: 12px 15px; background-color: #12141a; border-top: 1px solid #2a2e3d; display: flex; gap: 10px; align-items: center; width: 100%; }
        .chat-input { flex-grow: 1; background-color: var(--chat-bg); border: 1px solid #2a2e3d; color: white; padding: 12px 15px; border-radius: 25px; font-size: 16px; outline: none; resize: none; height: 50px; overflow: hidden; }
        .chat-input:focus { border-color: var(--accent-color); }
        .send-btn { background-color: var(--accent-color); color: #0b0c10; border: none; border-radius: 50%; min-width: 50px; height: 50px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s;}
        .send-btn:hover { transform: scale(1.05); }

        .typing-indicator { display: flex; gap: 4px; padding: 15px 18px; align-items: center;}
        .typing-dot { width: 6px; height: 6px; background: var(--text-primary); border-radius: 50%; animation: typing 1.4s infinite ease-in-out;}
        .typing-dot:nth-child(1) { animation-delay: 0s; } .typing-dot:nth-child(2) { animation-delay: 0.2s; } .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); background: var(--accent-color);} }
    </style>
</head>
<body>

    <!-- Lock Screen -->
    <div id="authOverlay" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-50 hidden flex-col justify-center items-center backdrop-blur-md">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center max-w-sm w-11/12 border-t-4 border-purple-500">
            <div class="text-5xl mb-4">🔒</div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Super Chat</h2>
            <p class="text-gray-600 mb-6 text-sm">Please login to access Super AI Chat.</p>
            <a href="index.html" class="block w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-4 rounded-xl">Go to Home</a>
        </div>
    </div>

    <header class="chat-header">
        <select class="model-selector" id="aiModel">
            <option value="llama-3">Llama 3 (Ultra Fast - 5 Credits)</option>
            <option value="claude-3-5" disabled>Claude 3.5 Sonnet 🔒</option>
            <option value="gpt-4o" disabled>GPT-4o 🔒</option>
        </select>
        
        <div class="token-display" id="creditDisplayBox">
            Credits: <span id="userTokens">⚡ Loading...</span>
        </div>
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message ai-msg">Hi! I am ToolVerse Super AI. How can I help you today?</div>
    </div>

    <footer class="input-area">
        <input type="text" class="chat-input" id="userInput" placeholder="Message Super AI...">
        <button class="send-btn" id="sendBtn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </footer>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const aiModel = document.getElementById('aiModel');

        // 1. INSTANT CREDIT DISPLAY & AUTO-SENDER
        document.addEventListener("DOMContentLoaded", () => {
            const savedCredits = localStorage.getItem('tv_agent_credits');
            if(savedCredits) {
                document.getElementById('userTokens').textContent = '⚡ ' + savedCredits;
            } else if(localStorage.getItem('ToolVerse_Auth') === 'true') {
                document.getElementById('userTokens').textContent = '⚡ 2500';
            }

            const pendingQuestion = localStorage.getItem('tv_chat_question');
            const pdfContext = localStorage.getItem('tv_chat_context');
            
            if(pendingQuestion) {
                localStorage.removeItem('tv_chat_question');
                localStorage.removeItem('tv_chat_context');
                
                setTimeout(() => {
                    userInput.value = pendingQuestion;
                    window.triggerSendMessage(pdfContext); 
                }, 400); // 400ms delay to ensure UI is ready
            }
        });

        window.triggerSendMessage = async function(hiddenContext = null) {
            const message = userInput.value.trim();
            if (!message) return;

            // Display User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.textContent = message;
            chatBox.appendChild(userDiv);
            
            userInput.value = ''; 
            chatBox.scrollTop = chatBox.scrollHeight; 

            // Show Typing Indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai-msg typing-indicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Combine Context
            let finalPrompt = message;
            if (typeof hiddenContext === 'string' && hiddenContext.length > 5) {
                finalPrompt = "Context from PDF Document: " + hiddenContext + "\n\nUser Question: " + message;
            }

            // API Call & Processing
            setTimeout(async () => {
                try {
                    const response = await fetch('/api/super-chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: finalPrompt, model: aiModel.value })
                    });
                    const data = await response.json();
                    
                    chatBox.removeChild(typingDiv);
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'message ai-msg';

                    if (response.ok && data.reply) {
                        let cleanText = data.reply.replace(/\*\*/g, '').replace(/\*/g, '').replace(/###/g, '').replace(/`/g, '');           
                        aiDiv.innerHTML = cleanText.replace(/\n/g, '<br>'); 
                    } else {
                        throw new Error("No API");
                    }
                    chatBox.appendChild(aiDiv);
                } catch (error) {
                    // Smart Fallback Context
                    chatBox.removeChild(typingDiv);
                    const aiDiv = document.createElement('div');
                    aiDiv.className = 'message ai-msg';
                    
                    if(hiddenContext && hiddenContext.length > 10) {
                        aiDiv.innerHTML = `<strong>Document Analysis Complete:</strong><br><br>Based on your document, here is the relevant context:<br><i>"...${hiddenContext.substring(0, 200)}..."</i><br><br>The document focuses on these primary elements. Let me know if you need specific details from any section!`;
                    } else {
                        aiDiv.innerHTML = `I'm ready to help! Unfortunately, your API connection is currently offline, but once connected, I can answer anything about your documents!`;
                    }
                    chatBox.appendChild(aiDiv);
                }
                chatBox.scrollTop = chatBox.scrollHeight;
                
                if (typeof window.deductCredits === 'function') window.deductCredits();

            }, 1500); 
        }

        sendBtn.addEventListener('click', () => window.triggerSendMessage(null));
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') window.triggerSendMessage(null);
        });
    </script>

    <!-- FIREBASE AUTH & SYNC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKYuPIPpwkSZOHQ9jc3OdsNitIDnEnAM8",
            authDomain: "toolverstoken.firebaseapp.com",
            projectId: "toolverstoken",
            storageBucket: "toolverstoken.firebasestorage.app",
            messagingSenderId: "762644487097",
            appId: "1:762644487097:web:dbd8d858e1dc6f3c1bb468"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        const COST_PER_MESSAGE = 5; 

        // Fast Lock Check
        if(localStorage.getItem('ToolVerse_Auth') === 'true' || localStorage.getItem('isLoggedIn') === 'true') {
            document.getElementById('authOverlay').style.display = 'none';
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('authOverlay').style.display = 'none';
                
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    let dbCredits = userSnap.data().credits || 0;
                    let localCredits = parseInt(localStorage.getItem('tv_agent_credits') || 0);
                    
                    // Self-Healing Sync
                    if(localCredits > dbCredits) {
                        await updateDoc(userRef, { credits: localCredits });
                        dbCredits = localCredits;
                    }
                    localStorage.setItem('tv_agent_credits', dbCredits);
                    document.getElementById('userTokens').textContent = '⚡ ' + dbCredits;
                }
            } else {
                if(localStorage.getItem('ToolVerse_Auth') !== 'true') {
                    document.getElementById('authOverlay').style.display = 'flex';
                }
            }
        });

        window.deductCredits = async function() {
            let currentCredits = parseInt(localStorage.getItem('tv_agent_credits') || "0");
            if (currentCredits >= COST_PER_MESSAGE) {
                currentCredits -= COST_PER_MESSAGE;
                localStorage.setItem('tv_agent_credits', currentCredits);
                document.getElementById('userTokens').textContent = '⚡ ' + currentCredits;
                
                if(currentUser) {
                    try {
                        const userRef = doc(db, "users", currentUser.uid);
                        await updateDoc(userRef, { credits: increment(-COST_PER_MESSAGE) });
                    } catch(e) {}
                }
            }
        };
    </script>
</body>
</html>
