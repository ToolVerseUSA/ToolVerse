<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super AI Chat - ToolVerse</title>
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --chat-bg: #1f2833;
            --text-primary: #c5c6c7;
            --accent-color: #66fcf1;
            --accent-hover: #45a29e;
            --message-user: #45a29e;
            --message-ai: #1f2833;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #12141a;
            border-bottom: 1px solid #2a2e3d;
            flex-wrap: wrap;
            gap: 10px;
        }

        .model-selector {
            background-color: var(--chat-bg);
            color: white;
            border: 1px solid #2a2e3d;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            flex-grow: 1;
        }

        .token-display {
            background-color: rgba(102, 252, 241, 0.1);
            color: var(--accent-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: 1px solid var(--accent-color);
            white-space: nowrap;
        }

        .chat-container {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 88%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px; 
            word-wrap: break-word;
        }

        .user-msg {
            background-color: var(--message-user);
            color: #0b0c10;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-msg {
            background-color: var(--message-ai);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #2a2e3d;
            border-radius: 2px 12px 12px 12px;
        }

        .input-area {
            padding: 12px 15px;
            background-color: #12141a;
            border-top: 1px solid #2a2e3d;
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .chat-input {
            flex-grow: 1;
            background-color: var(--chat-bg);
            border: 1px solid #2a2e3d;
            color: white;
            padding: 12px 15px;
            border-radius: 25px;
            font-size: 16px; 
            outline: none;
            resize: none;
            height: 50px;
            overflow: hidden;
        }

        .chat-input:focus {
            border-color: var(--accent-color);
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #0b0c10;
            border: none;
            border-radius: 50%;
            min-width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 600px) {
            .message { max-width: 95%; }
        }
    </style>
</head>
<body>

    <header class="chat-header">
        <select class="model-selector" id="aiModel">
            <option value="llama-3">Llama 3 (Ultra Fast - 5 Credits)</option>
            <option value="claude-3-5" disabled>Claude 3.5 Sonnet 🔒</option>
            <option value="gpt-4o" disabled>GPT-4o 🔒</option>
        </select>
        
        <div class="token-display" id="creditDisplayBox">
            Credits: <span id="userTokens">Loading...</span>
        </div>
    </header>

    <div class="chat-container" id="chatBox">
        <div class="message ai-msg">Hi! I am ToolVerse Super AI. How can I help you today?</div>
    </div>

    <footer class="input-area">
        <input type="text" class="chat-input" id="userInput" placeholder="Message Super AI...">
        <button class="send-btn" id="sendBtn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </footer>

    <!-- FIREBASE INITIALIZATION & CREDITS LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKYuPIPpwkSZOHQ9jc3OdsNitIDnEnAM8",
            authDomain: "toolverstoken.firebaseapp.com",
            projectId: "toolverstoken",
            storageBucket: "toolverstoken.firebasestorage.app",
            messagingSenderId: "762644487097",
            appId: "1:762644487097:web:dbd8d858e1dc6f3c1bb468",
            measurementId: "G-6VX2WPNECZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userCredits = 0;
        const COST_PER_MESSAGE = 5; 
        
        const userTokensDisplay = document.getElementById('userTokens');
        const creditDisplayBox = document.getElementById('creditDisplayBox');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists()) {
                    userCredits = userSnap.data().credits || 0;
                    userTokensDisplay.textContent = '⚡ ' + userCredits;
                } else {
                    userTokensDisplay.textContent = '⚡ 0';
                }
            } else {
                currentUser = null;
                userCredits = 0;
                creditDisplayBox.innerHTML = `<a href="index.html" style="color: var(--accent-color); text-decoration: none;">Login Required ➔</a>`;
            }
        });

        window.deductCredits = async function() {
            if (!currentUser) {
                alert("Please login from the home page to use Super AI.");
                window.location.href = 'index.html';
                return false;
            }
            if (userCredits < COST_PER_MESSAGE) {
                alert(`Not enough credits! You need at least ${COST_PER_MESSAGE} credits to send a message. Please upgrade your plan or claim daily bonuses.`);
                return false;
            }

            try {
                const userRef = doc(db, "users", currentUser.uid);
                await updateDoc(userRef, {
                    credits: increment(-COST_PER_MESSAGE)
                });
                
                userCredits -= COST_PER_MESSAGE;
                document.getElementById('userTokens').textContent = '⚡ ' + userCredits;
                return true;
            } catch (error) {
                console.error("Credit deduction failed:", error);
                alert("Error processing credits. Please check your connection.");
                return false;
            }
        };
    </script>

    <!-- CHAT INTERFACE LOGIC -->
    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const aiModel = document.getElementById('aiModel');

        // NEW: Auto-load context from AI Summarizer
        document.addEventListener('DOMContentLoaded', () => {
            const pendingQuestion = localStorage.getItem('tv_chat_question');
            const pdfContext = localStorage.getItem('tv_chat_context');
            
            if(pendingQuestion) {
                localStorage.removeItem('tv_chat_question');
                localStorage.removeItem('tv_chat_context');
                
                userInput.value = pendingQuestion;
                sendMessage(pdfContext); 
            }
        });

        async function sendMessage(hiddenContext = null) {
            const message = userInput.value.trim();
            if (!message) return;

            if (typeof window.deductCredits === 'function') {
                sendBtn.disabled = true; 
                const canSend = await window.deductCredits();
                sendBtn.disabled = false;
                if (!canSend) return; 
            }

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            userDiv.textContent = message;
            chatBox.appendChild(userDiv);
            
            userInput.value = ''; 
            chatBox.scrollTop = chatBox.scrollHeight; 

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai-msg';
            aiDiv.textContent = 'Thinking...';
            chatBox.appendChild(aiDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            // COMBINE CONTEXT FOR API
            let finalPrompt = message;
            if (typeof hiddenContext === 'string' && hiddenContext.length > 5) {
                finalPrompt = "Context from PDF Document: " + hiddenContext + "\n\nUser Question: " + message;
            }

            try {
                const response = await fetch('/api/super-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: finalPrompt, 
                        model: aiModel.value
                    })
                });

                const data = await response.json();
                
                if (response.ok && data.reply) {
                    let cleanText = data.reply
                        .replace(/\*\*/g, '')         
                        .replace(/\*/g, '')           
                        .replace(/###/g, '')          
                        .replace(/```[a-z]*\n/gi, '') 
                        .replace(/```/g, '')          
                        .replace(/`/g, '');           
                    
                    aiDiv.innerHTML = cleanText.replace(/\n/g, '<br>'); 
                    
                } else {
                    aiDiv.textContent = 'Error: ' + (data.error || 'No response from server.');
                }
            } catch (error) {
                aiDiv.textContent = 'Error: Connection failed.';
                console.error('Chat Error:', error);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', () => sendMessage(null));
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage(null);
            }
        });
    </script>

</body>
</html>
