name: Fetch remote jobs

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch jobs from Jobicy
        run: node scripts/fetch-jobs.mjs

      - name: Commit updated jobs file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add earn/remote-jobs/jobs.json
          if git diff --cached --quiet; then
            echo "No job changes to commit."
          else
            git commit -m "Update remote jobs list"
            git push
          fi
