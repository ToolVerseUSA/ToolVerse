<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Planner - ToolVerse</title>
    <!-- PDF لائبریری -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* Modern UI Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input[type="text"] {
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .main-btn {
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #2563eb, #4f46e5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .main-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(to right, #1d4ed8, #4338ca);
        }
        #planner-output {
            margin-top: 30px;
            display: none;
        }
        /* پرنٹ کے وقت بیک گراؤنڈ سیٹ کرنے کے لیے */
        #pdf-content {
            padding: 10px;
            border-radius: 8px;
        }
        .task-card {
            background-color: #1e293b;
            border-left: 4px solid #38bdf8;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .task-card input[type="checkbox"] {
            margin-top: 5px;
            transform: scale(1.2);
            cursor: pointer;
        }
        /* نئے بٹنز کی اسٹائلنگ */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: white;
        }
        .copy-btn { background-color: #10b981; }
        .copy-btn:hover { background-color: #059669; }
        .pdf-btn { background-color: #ef4444; }
        .pdf-btn:hover { background-color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Task Planner</h1>
    <p class="subtitle">Enter your big goal, and let AI break it down into actionable steps.</p>
    
    <div class="input-group">
        <input type="text" id="user-goal" placeholder="e.g., Create a 10-minute faceless YouTube video..." autocomplete="off">
        <button id="generate-btn" class="main-btn" onclick="generatePlan()">Generate Action Plan ✨</button>
    </div>

    <div id="planner-output">
        <div id="pdf-content">
            <h3 style="color: #e2e8f0; margin-bottom: 20px;">Your Action Plan:</h3>
            <div id="tasks-container"></div>
        </div>
        
        <div class="action-buttons" id="action-buttons-container">
            <button class="action-btn copy-btn" onclick="copyPlan()">📋 Copy Plan</button>
            <button class="action-btn pdf-btn" onclick="downloadPDF()">📄 Download PDF</button>
        </div>
    </div>
</div>

<script>
    async function generatePlan() {
        const goal = document.getElementById('user-goal').value;
        const output = document.getElementById('planner-output');
        const tasksContainer = document.getElementById('tasks-container');
        const btn = document.getElementById('generate-btn');
        
        if(!goal) {
            alert("Please enter a goal first! (e.g., Start a YouTube channel)");
            return;
        }

        // Loading State
        btn.innerText = "Analyzing and Planning... ⏳";
        btn.disabled = true;
        btn.style.opacity = "0.7";
        output.style.display = 'block';
        document.getElementById('action-buttons-container').style.display = 'none';
        tasksContainer.innerHTML = '<p style="color: #38bdf8; text-align: center; font-weight: 500;">AI is analyzing your goal securely...</p>';
        
        try {
            const response = await fetch('/api/planner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ goal: goal })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Server Error: " + response.status);
            }

            let tasks = data.steps;

            if (!Array.isArray(tasks)) {
                if (tasks.steps) tasks = tasks.steps;
                else if (tasks.tasks) tasks = tasks.tasks;
                else tasks = Object.values(tasks)[0]; 
            }

            let tasksHTML = '';
            tasks.forEach((task, index) => {
                tasksHTML += `
                    <div class="task-card">
                        <input type="checkbox">
                        <div>
                            <strong style="color: #f8fafc;">Step ${index + 1}: ${task?.title || "Action Step"}</strong>
                            <p style="color: #94a3b8; margin: 5px 0 0 0; font-size: 14px;">${task?.description || task}</p>
                        </div>
                    </div>
                `;
            });

            tasksContainer.innerHTML = tasksHTML;
            document.getElementById('action-buttons-container').style.display = 'flex';

        } catch (error) {
            console.error("Task Planner Error:", error);
            tasksContainer.innerHTML = `
                <div style="background: rgba(255, 71, 87, 0.1); border: 1px solid #ff4757; padding: 15px; border-radius: 8px; text-align: center;">
                    <p style="color: #ff4757; margin: 0; font-weight: bold;">⚠️ Error Details:</p>
                    <p style="color: #cbd5e1; font-size: 13px; margin-top: 5px;">${error.message}</p>
                </div>
            `;
        } finally {
            btn.innerText = "Generate Action Plan ✨";
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }

    function copyPlan() {
        const tasks = document.querySelectorAll('.task-card');
        let planText = "My AI Action Plan:\n\n";
        
        tasks.forEach((task, index) => {
            const title = task.querySelector('strong').innerText;
            const desc = task.querySelector('p').innerText;
            planText += `${title}\n${desc}\n\n`;
        });

        navigator.clipboard.writeText(planText).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = "✅ Copied Successfully!";
            setTimeout(() => { copyBtn.innerHTML = originalText; }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
            alert("Copy failed. Please try again.");
        });
    }

    function downloadPDF() {
        const element = document.getElementById('pdf-content');
        const pdfBtn = document.querySelector('.pdf-btn');
        const originalText = pdfBtn.innerHTML;
        
        pdfBtn.innerHTML = "⏳ Generating...";
        pdfBtn.disabled = true;

        // PDF کی سیٹنگز تاکہ ڈارک موڈ کلرز ٹھیک سے پرنٹ ہوں
        const opt = {
            margin:       0.5,
            filename:     'AI_Action_Plan.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, backgroundColor: '#0f172a' },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            pdfBtn.innerHTML = "✅ Downloaded!";
            setTimeout(() => { 
                pdfBtn.innerHTML = originalText;
                pdfBtn.disabled = false;
            }, 2000);
        });
    }
</script>

</body>
</html>
