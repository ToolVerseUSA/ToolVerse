<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Planner - ToolVerse</title>
    <style>
        /* Modern UI Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 40px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 {
            text-align: center;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input[type="text"] {
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        button {
            padding: 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #2563eb, #4f46e5);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(to right, #1d4ed8, #4338ca);
        }
        #planner-output {
            margin-top: 30px;
            display: none;
        }
        .task-card {
            background-color: #1e293b;
            border-left: 4px solid #38bdf8;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: flex-start;
            gap: 15px;
        }
        .task-card input[type="checkbox"] {
            margin-top: 5px;
            transform: scale(1.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Task Planner</h1>
    <p class="subtitle">Enter your big goal, and let AI break it down into actionable steps.</p>
    
    <div class="input-group">
        <input type="text" id="user-goal" placeholder="e.g., Create a 10-minute faceless YouTube video..." autocomplete="off">
        <button id="generate-btn" onclick="generatePlan()">Generate Action Plan ✨</button>
    </div>

    <div id="planner-output">
        <!-- AI Generated Tasks will appear here -->
    </div>
</div>

<script>
    // Modern AI Task Planner Logic using Google Gemini 1.5 Flash (Upgraded)
    const API_KEY = 'AIzaSyBxJ6GOimRwF1B9QyDYW8yevEFvvcvWaYI'; 

    async function generatePlan() {
        const goal = document.getElementById('user-goal').value;
        const output = document.getElementById('planner-output');
        const btn = document.getElementById('generate-btn');
        
        if(!goal) {
            alert("Please enter a goal first! (e.g., Start a YouTube channel)");
            return;
        }

        // Loading State
        btn.innerText = "Analyzing and Planning... ⏳";
        btn.disabled = true;
        btn.style.opacity = "0.7";
        output.style.display = 'block';
        output.innerHTML = '<p style="color: #38bdf8; text-align: center; font-weight: 500;">AI is analyzing your goal...</p>';
        
        const prompt = `Break down this goal into 3 to 5 highly actionable steps: "${goal}". For each step, provide a short title and a 1-sentence practical description. Output strictly as a JSON array with 'title' and 'description' keys.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    // یہ لائن گوگل کو مجبور کرے گی کہ وہ 100% درست JSON میں ہی جواب دے
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            // اگر گوگل کوئی ایرر دے گا، تو اب وہ سیدھا آپ کی اسکرین پر لکھا آئے گا
            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "Google API Error: " + response.status);
            }

            const data = await response.json();
            let aiText = data.candidates[0].content.parts[0].text;
            
            let tasks = JSON.parse(aiText);

            // اگر گوگل نے ایرے (Array) کے بجائے آبجیکٹ بھیجا تو اسے ٹھیک کرنے کا طریقہ
            if (!Array.isArray(tasks)) {
                if (tasks.steps) tasks = tasks.steps;
                else if (tasks.tasks) tasks = tasks.tasks;
                else tasks = Object.values(tasks)[0]; 
            }

            let tasksHTML = '<h3 style="color: #e2e8f0; margin-bottom: 20px;">Your Action Plan:</h3>';
            tasks.forEach((task, index) => {
                tasksHTML += `
                    <div class="task-card">
                        <input type="checkbox">
                        <div>
                            <strong style="color: #f8fafc;">Step ${index + 1}: ${task?.title || "Action Step"}</strong>
                            <p style="color: #94a3b8; margin: 5px 0 0 0; font-size: 14px;">${task?.description || task}</p>
                        </div>
                    </div>
                `;
            });

            output.innerHTML = tasksHTML;

        } catch (error) {
            console.error("Task Planner Error:", error);
            output.innerHTML = `
                <div style="background: rgba(255, 71, 87, 0.1); border: 1px solid #ff4757; padding: 15px; border-radius: 8px; text-align: center;">
                    <p style="color: #ff4757; margin: 0; font-weight: bold;">⚠️ Error Details:</p>
                    <p style="color: #cbd5e1; font-size: 13px; margin-top: 5px;">${error.message}</p>
                </div>
            `;
        } finally {
            btn.innerText = "Generate Action Plan ✨";
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }
</script>

</body>
</html>
