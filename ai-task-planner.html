<body>

<a href="index.html" class="home-link">← Back to Home</a>

<div class="container">
    <h1>AI Task Planner</h1>
    <p class="subtitle">Enter your big goal, and let AI break it down into actionable steps.</p>
    
    <div class="input-group">
        <input type="text" id="user-goal" placeholder="e.g., Create a 10-minute faceless YouTube video..." autocomplete="off">
        <button id="generate-btn" class="main-btn" onclick="generatePlan()">Generate Action Plan ✨</button>
    </div>

    <div id="planner-output">
        <div id="pdf-content">
            <h3 style="color: #e2e8f0; margin-bottom: 20px;">Your Action Plan:</h3>
            <div id="tasks-container"></div>
        </div>
        
        <div class="action-buttons" id="action-buttons-container">
            <button class="action-btn copy-btn" onclick="copyPlan()">📋 Copy Plan</button>
            <button class="action-btn pdf-btn" onclick="downloadPDF()">📄 Download PDF</button>
        </div>
    </div>
</div>

<script>
    async function generatePlan() {
        const goal = document.getElementById('user-goal').value.trim();
        const output = document.getElementById('planner-output');
        const tasksContainer = document.getElementById('tasks-container');
        const btn = document.getElementById('generate-btn');
        
        if(!goal) {
            alert("Please enter a goal first! (e.g., Start a YouTube channel)");
            return;
        }

        // ==========================================
        // VVIP AUTH & FAST CREDIT CHECK (0ms Delay)
        // ==========================================
        const isAuth = localStorage.getItem('ToolVerse_Auth') === 'true' || localStorage.getItem('isLoggedIn') === 'true';
        if (!isAuth) {
            alert("🔒 Please login from the Dashboard to use Premium Tools.");
            window.location.href = "index.html";
            return;
        }

        let currentCredits = parseInt(localStorage.getItem('tv_agent_credits') || "0");
        if (currentCredits <= 0) {
            alert("🎁 You have run out of Credits!");
            tasksContainer.innerHTML = "<span style='color: #ef4444;'>Insufficient Credits. Please upgrade in Dashboard.</span>";
            output.style.display = 'block';
            return; 
        }

        // Loading State
        btn.innerText = "Analyzing and Planning... ⏳";
        btn.disabled = true;
        btn.style.opacity = "0.7";
        output.style.display = 'block';
        document.getElementById('action-buttons-container').style.display = 'none';
        tasksContainer.innerHTML = '<p style="color: #38bdf8; text-align: center; font-weight: 500;">AI is analyzing your goal securely...</p>';
        
        try {
            // Deduct 1 Credit instantly
            currentCredits -= 1; 
            localStorage.setItem('tv_agent_credits', currentCredits);

            // Using standardized groq-handler to maintain system architecture
            const systemPrompt = `You are an expert AI Task Planner. Break down the user's goal into 5-8 highly actionable, practical steps. 
            Respond ONLY with a raw JSON array of objects. Do not include markdown formatting, backticks, or introductory text. 
            Each object MUST have exactly two keys: "title" (a short, punchy step name) and "description" (a 1-2 sentence detailed explanation of how to execute it).`;
            const userPrompt = `Goal: ${goal}`;

            const response = await fetch('/api/groq-handler', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ systemPrompt, userPrompt })
            });

            const data = await response.json();

            if (!response.ok || !data.result) {
                throw new Error(data.error || "Server Error: API did not respond properly.");
            }

            // Clean up possible markdown added by AI and parse JSON
            let cleanJSON = data.result.replace(/```json/g, '').replace(/```/g, '').trim();
            let tasks = JSON.parse(cleanJSON);

            if (!Array.isArray(tasks)) {
                if (tasks.steps) tasks = tasks.steps;
                else if (tasks.tasks) tasks = tasks.tasks;
                else tasks = Object.values(tasks)[0]; 
            }

            let tasksHTML = '';
            tasks.forEach((task, index) => {
                tasksHTML += `
                    <div class="task-card">
                        <input type="checkbox">
                        <div>
                            <strong style="color: #f8fafc;">Step ${index + 1}: ${task?.title || "Action Step"}</strong>
                            <p style="color: #94a3b8; margin: 5px 0 0 0; font-size: 14px;">${task?.description || task}</p>
                        </div>
                    </div>
                `;
            });

            tasksContainer.innerHTML = tasksHTML;
            document.getElementById('action-buttons-container').style.display = 'flex';

        } catch (error) {
            console.error("Task Planner Error:", error);
            tasksContainer.innerHTML = `
                <div style="background: rgba(255, 71, 87, 0.1); border: 1px solid #ff4757; padding: 15px; border-radius: 8px; text-align: center;">
                    <p style="color: #ff4757; margin: 0; font-weight: bold;">⚠️ Error Details:</p>
                    <p style="color: #cbd5e1; font-size: 13px; margin-top: 5px;">${error.message}</p>
                </div>
            `;
        } finally {
            btn.innerText = "Generate Action Plan ✨";
            btn.disabled = false;
            btn.style.opacity = "1";
        }
    }

    function copyPlan() {
        const tasks = document.querySelectorAll('.task-card');
        let planText = "My AI Action Plan:\n\n";
        
        tasks.forEach((task, index) => {
            const title = task.querySelector('strong').innerText;
            const desc = task.querySelector('p').innerText;
            planText += `${title}\n${desc}\n\n`;
        });

        navigator.clipboard.writeText(planText).then(() => {
            const copyBtn = document.querySelector('.copy-btn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = "✅ Copied Successfully!";
            setTimeout(() => { copyBtn.innerHTML = originalText; }, 2000);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
            alert("Copy failed. Please try again.");
        });
    }

    function downloadPDF() {
        const element = document.getElementById('pdf-content');
        const pdfBtn = document.querySelector('.pdf-btn');
        const originalText = pdfBtn.innerHTML;
        
        pdfBtn.innerHTML = "⏳ Generating...";
        pdfBtn.disabled = true;

        const opt = {
            margin:       0.5,
            filename:     'AI_Action_Plan.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, backgroundColor: '#0f172a' },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            pdfBtn.innerHTML = "✅ Downloaded!";
            setTimeout(() => { 
                pdfBtn.innerHTML = originalText;
                pdfBtn.disabled = false;
            }, 2000);
        });
    }
</script>

<!-- VVIP UNIVERSAL UNLOCK SCRIPT -->

        unlockStyle.innerHTML = `
            #authOverlay, #firebaseAuthModal, .auth-modal, #loginModal { 
                display: none !important; opacity: 0 !important; pointer-events: none !important; z-index: -9999 !important; visibility: hidden !important;
            }
            body { overflow: auto !important; }
        `;
        document.head.appendChild(unlockStyle);
        window.isUserLoggedIn = true;
        setInterval(() => {
            const lockScreens = document.querySelectorAll('#authOverlay, #firebaseAuthModal, .auth-modal, #loginModal');
            lockScreens.forEach(lock => { if(lock) lock.style.display = 'none'; });
            window.isUserLoggedIn = true;
        }, 200);
    }
</script>
