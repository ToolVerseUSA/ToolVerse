<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Caption Generator | Premium ToolVerse</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* VVIP Specific Styles for Caption Generator */
        .caption-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
        .input-card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #eaeaea; }
        .output-card { background: #0f172a; padding: 30px; border-radius: 16px; color: #f8fafc; box-shadow: 0 15px 40px rgba(0,0,0,0.15); position: relative; }
        .output-card h3 { color: #f472b6; margin-top: 0; font-size: 1.2rem; border-bottom: 1px solid #1e293b; padding-bottom: 15px; }
        
        .caption-content { font-family: 'Inter', sans-serif; line-height: 1.7; font-size: 15px; margin-top: 20px; white-space: pre-wrap; height: 500px; overflow-y: auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        
        .copy-btn-dark { position: absolute; top: 20px; right: 20px; background: #db2777; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: 0.3s; }
        .copy-btn-dark:hover { background: #be185d; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #334155; font-size: 14px;}
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; background: #fff;}
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #db2777; box-shadow: 0 0 0 3px rgba(219, 39, 119, 0.1); }
        .form-group textarea { resize: vertical; }
        
        .premium-btn { background: linear-gradient(135deg, #ec4899, #be185d); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);}
        .premium-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4); }
        .premium-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none;}
        
        @media (max-width: 768px) { .caption-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="container" style="padding: 20px 0; display:flex; justify-content:space-between; align-items:center;">
            <div class="logo" style="font-weight:bold; font-size:24px;">🚀 ToolVerse</div>
            <a href="index.html" style="text-decoration:none; color:#333; font-weight:500;">Back to Home</a>
        </div>
    </header>

    <section class="tool-header" style="text-align: center; padding: 60px 20px; background: linear-gradient(to right, #fce7f3, #fbcfe8);">
        <h1 style="font-size: 2.5rem; color: #9d174d; margin-bottom: 10px;">📱 AI Caption Generator</h1>
        <p style="color: #be185d; font-size: 1.1rem;">Generate viral, engaging, and perfectly formatted captions for your social media posts.</p>
    </section>

    <div class="caption-container">
        <!-- Left Side: Inputs -->
        <div class="input-card">
            <div class="form-group">
                <label>What is your post/video about?</label>
                <textarea id="postTopic" rows="3" placeholder="e.g. A behind-the-scenes look at my new web development project..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Target Platform</label>
                <select id="platform">
                    <option value="Instagram Reel / Post">Instagram (Reel/Post)</option>
                    <option value="TikTok">TikTok</option>
                    <option value="LinkedIn">LinkedIn</option>
                    <option value="YouTube Shorts">YouTube Shorts</option>
                    <option value="Facebook/Twitter">Facebook / X (Twitter)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tone of Voice</label>
                <select id="captionTone">
                    <option value="Engaging & Ask a Question">Engaging (Ask a Question)</option>
                    <option value="Witty & Humorous">Witty & Humorous</option>
                    <option value="Professional & Value-Driven">Professional & Value-Driven</option>
                    <option value="Inspirational & Storytelling">Inspirational & Storytelling</option>
                    <option value="Short & Punchy">Short & Punchy</option>
                </select>
            </div>

            <div class="form-group">
                <label>Caption Length</label>
                <select id="captionLength">
                    <option value="Medium (Ideal for most posts)">Medium (Standard)</option>
                    <option value="Short (Minimalist)">Short (Minimalist)</option>
                    <option value="Long (Micro-blog style)">Long (Micro-blog style)</option>
                </select>
            </div>

            <button class="premium-btn" id="generateCaptionBtn">✨ Generate Caption</button>
        </div>

        <!-- Right Side: Output Studio -->
        <div class="output-card">
            <button class="copy-btn-dark" id="copyBtn">📋 Copy</button>
            <h3>✍️ Your Viral Caption</h3>
            <div class="caption-content" id="outCaption">
                <span style="color: #64748b; font-style: italic;">Tell us about your post on the left and hit generate. Watch the AI craft a caption with a perfect hook, emojis, and viral hashtags...</span>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <!-- App Logic -->
    <script src="caption-generator.js"></script>

</body>
</html>
